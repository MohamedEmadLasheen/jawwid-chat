# Jawwid Chat — CI
#
# Release gates are QA-owned (AI #5). The infrastructure jobs — configuration
# validation, container images, dependency audit — are AI #7's. AI #5 decides
# what must pass; AI #7 provides the pipeline that runs it.
#
# Ordered for fast feedback: cheap release-gate guards run first and fail the
# whole run in seconds, then per-package typecheck/tests, then the deeper
# migration gate that needs a database.
#
# Gate references are to docs/qa/release-gate.md.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow is triggered by pull_request, so it can be run
# by anyone able to open one. It reads; it never writes and never deploys.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------- fast gates
  guards:
    name: Release-gate guards (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: G-18 · no secrets committed
        run: |
          set -uo pipefail
          # Hard patterns: never legitimate anywhere in the tree.
          if grep -rInE '(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist . ; then
            echo "::error::G-18 FAIL — credential material committed"; exit 1
          fi
          # JWT-shaped strings, excluding test files. A synthetic token inside a
          # redaction test is the control working, not a leak (AI #3's
          # redacting_logger_test.dart asserts such a token never reaches a log),
          # so test paths are exempt from this heuristic only.
          if grep -rInE 'eyJhbGciOi[A-Za-z0-9_-]{10,}' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist \
               --exclude-dir=test --exclude-dir=tests \
               --exclude='*_test.dart' --exclude='*.spec.ts' --exclude='*.test.ts' . ; then
            echo "::error::G-18 FAIL — JWT-shaped credential committed outside a test"; exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production)$' ; then
            echo "::error::G-18 FAIL — a real .env file is tracked"; exit 1
          fi
          echo "G-18 pass"

      - name: G-20 · no real employee names in source, tests or seed data
        run: |
          set -uo pipefail
          # The product brief names real staff. They are acceptable in docs/,
          # never in code, fixtures or seed data (system-inventory.md §4).
          hits=$(grep -rIl $'رحاب\|زينب\|دينا\|أسماء\|مريم\|رضوى\|رقيه' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=docs . || true)
          if [ -n "$hits" ]; then
            echo "::error::G-20 FAIL — real employee names outside docs/:"; echo "$hits"; exit 1
          fi
          echo "G-20 pass"

      - name: JC-011 · protected regression tests must not be deleted or gutted
        run: bash scripts/qa/check-protected-tests.sh

      - name: G-31..G-35 · Phase 2 functionality must not ship in MVP
        run: |
          set -uo pipefail
          # Advisory scan. Fails only on unmistakable Phase 2 feature wiring.
          if grep -rInE '\b(videoCall|enableVideo|startVideo|broadcastToAll|aiScore|aiSuggest|draftWithAI)\b' \
               --include='*.ts' --include='*.dart' --include='*.tsx' \
               --exclude-dir=node_modules --exclude-dir=dist . ; then
            echo "::error::G-31..G-35 FAIL — Phase 2 capability referenced in MVP code"; exit 1
          fi
          echo "G-31..G-35 pass"

      # ---- infrastructure guardrails (AI #7) --------------------------------
      # Complementary to G-18 above, not a replacement: G-18 catches credential
      # material anywhere; these catch this project's specific failure modes.

      - name: Secret scan — worktree and history
        run: scripts/infra/scan-secrets.sh --history

      - name: Server secrets must not be reachable from a client bundle
        run: scripts/infra/check-web-env.sh

      - name: The local environment example is valid
        run: scripts/infra/check-env.sh local --file .env.example

      - name: Environment templates match the manifest
        # The templates are generated from infra/env/manifest.tsv. A
        # hand-edited template drifts from the checker that deployments run,
        # and the drift is only discovered by a failed release.
        run: |
          scripts/infra/render-env-template.sh staging    > /tmp/staging.env.example
          scripts/infra/render-env-template.sh production > /tmp/production.env.example
          diff -u infra/env/staging.env.example    /tmp/staging.env.example
          diff -u infra/env/production.env.example /tmp/production.env.example

  # ------------------------------------------------------------------ backend
  api:
    name: API · typecheck + unit
    runs-on: ubuntu-latest
    needs: guards
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (incl. G-07 phone-privacy guard, G-04/G-44 authz)
        run: npm run test:unit

  # ---------------------------------------------------------------- admin web
  admin-web:
    name: Admin Web · typecheck + tests
    runs-on: ubuntu-latest
    needs: guards
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.ci.invalid/api/v1
          VITE_REALTIME_URL: wss://api.ci.invalid
          VITE_APP_ENV: ci

      - name: No credential reached the browser bundle
        working-directory: .
        run: scripts/infra/check-web-env.sh --bundle apps/admin-web/dist

  # --------------------------------------------------------------- migrations
  migrations:
    name: G-19 · migrations apply and are idempotent
    runs-on: ubuntu-latest
    needs: guards
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jawwid_chat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/jawwid_chat_test
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        # Pinned to 17 to MATCH THE SERVICE CONTAINER above. pg_dump refuses to
        # dump from a server newer than itself, so a distro client that lags the
        # service turns the backup/restore drill below into a version error that
        # reads like a broken script.
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          psql --version && pg_dump --version

      # RT-023. There is no branch composition and no Core/identity stub any
      # more: supabase/migrations is the single SQL authority and builds an
      # empty database on its own. Reintroducing a stub or a `git show` from
      # another branch here would restore the finding.
      - name: G-19 · migrations apply from an empty database
        run: bash scripts/db/apply.sh

      - name: G-19 · re-apply must be a no-op
        run: |
          out=$(bash scripts/db/apply.sh)
          echo "$out"
          if echo "$out" | grep -q '^  apply'; then
            echo "::error::G-19 FAIL — a migration re-applied on a clean ledger"; exit 1
          fi

      # RT-023 acceptance: every table, FK, trigger and index a running system
      # needs is present, and nothing from another product's database is.
      - name: G-19 · fresh-database schema acceptance
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/tests/schema_acceptance.sql

      # RT-024 / RT-025. The BR-1 backstop, proven against the database with the
      # application entirely out of the picture. Do not weaken an assertion in
      # db/tests/br1_invariants.sql to make a change pass.
      - name: G-01 · BR-1 structural invariants (RT-024, RT-025)
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/tests/br1_invariants.sql

      # Phase 8. These four suites existed and passed but were gated by NOTHING,
      # so a regression in tenant isolation or RLS enforcement at the DATABASE
      # level could ship while every application test stayed green. They are the
      # backstop for exactly the controls that must not silently weaken.
      - name: G-09 · tenant isolation (database level)
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/tests/tenant_isolation.sql

      - name: G-09 · RLS is actually enforced on the runtime role
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/tests/rls_enforcement.sql

      - name: G-12 · supervisor assignment invariants
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/tests/assignment_invariants.sql

      - name: OD-01 · conversation model invariants
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/tests/od01_conversation_model.sql

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Integration suite
        working-directory: apps/api
        run: |
          npm ci
          npx prisma generate
          npm run test:int

      # ---- AI #7 -----------------------------------------------------------
      # G-41. Phase 8 replaced a BACKUP drill with a BACKUP-AND-RESTORE drill,
      # because the backup half was never the part that was broken.
      #
      # What the backup-only step could not see: every dump was taken with
      # --no-privileges, so it carried zero ACL entries, and every restore
      # produced a database in which chat_app could not INSERT into a single
      # table. The archive was fine. The recovery was not, and only restoring
      # and then TESTING the result says which.
      #
      # A backup that has never been restored is an assumption, and one that has
      # been restored but not verified is a different assumption. This step
      # takes the dump, restores it into a database that did not exist, and runs
      # the same acceptance and invariant suites against the copy.
      - name: G-41 · backup, restore and verify the restored database
        run: |
          set -euo pipefail
          APP_ENV=ci PG_IMAGE=postgres:17-alpine \
            scripts/infra/backup-db.sh --out ./backups --schema chat
          dump="$(ls -t ./backups/*.dump | head -1)"

          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -c 'create database jawwid_chat_recovered'
          recovered="${DATABASE_URL%/*}/jawwid_chat_recovered"

          PG_IMAGE=postgres:17-alpine \
            scripts/infra/restore-db.sh --file "$dump" --into "$recovered" --schema chat

          # The restored copy must satisfy the same gates as a migrated one. If
          # privileges, role attributes or role memberships did not survive,
          # schema_acceptance and rls_enforcement are what say so.
          for suite in schema_acceptance br1_invariants rls_enforcement \
                       tenant_isolation assignment_invariants od01_conversation_model; do
            echo "::group::restored · $suite"
            psql -v ON_ERROR_STOP=1 "$recovered" -f "db/tests/$suite.sql"
            echo "::endgroup::"
          done

          # Data, not just structure: a restore that produces an empty database
          # passes every structural check above.
          rows=$(psql -tAX "$recovered" -c 'select count(*) from chat.config')
          echo "restored chat.config rows: $rows"
          [ "$rows" -gt 0 ] || { echo "::error::G-41 FAIL — restored database has no config rows"; exit 1; }

  # ------------------------------------------------------------------- images
  # AI #7. Deployment artifacts must build, and must not run privileged.
  images:
    name: Container images build and run unprivileged
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        # Note: this regenerates the Prisma client from scratch, so it catches
        # schema/code drift that a local build hides behind a stale client.
        run: docker build -t jawwid-chat-api:${{ github.sha }} apps/api

      - name: The API image must not run as root
        run: |
          user="$(docker run --rm --entrypoint id jawwid-chat-api:${{ github.sha }} -un)"
          echo "image user: $user"
          [ "$user" != "root" ] || { echo "::error::API image runs as root"; exit 1; }

      - name: Build Admin Web image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://api.ci.invalid/api/v1 \
            --build-arg VITE_REALTIME_URL=wss://api.ci.invalid \
            -t jawwid-chat-admin:${{ github.sha }} apps/admin-web

  # ------------------------------------------------------------- dependencies
  # AI #7. Advisory: a transitive advisory with no fix available must not block
  # an unrelated bugfix. Promoting this to blocking is AI #5's gate decision.
  dependencies:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Audit — high and critical
        continue-on-error: true
        run: |
          for app in apps/api apps/admin-web; do
            echo "::group::$app"
            (cd "$app" && npm audit --audit-level=high) || true
            echo "::endgroup::"
          done

  # ------------------------------------------------------------------- mobile
  # G-37. This job used to print four ::warning:: lines and exit 0 -- a green
  # check that tested nothing, which is worse than a red one, because a green
  # check is read as evidence. The Flutter SDK was absent from every DEVELOPER
  # machine; it was never absent from a GitHub runner, which can install it in
  # about a minute.
  #
  # So it runs the tests now, and if they fail the job fails. That is the point.
  # The release gate's own rule is that a failing gate and an unverified gate are
  # treated identically -- "an untested control is not a control" -- and 30 Dart
  # test files that have never executed anywhere are unverified by construction.
  # Whatever this finds on its first real run is information the project did not
  # previously have.
  mobile:
    name: Mobile · analyze + test
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Matches `environment.flutter` in pubspec.yaml. Pinned to a channel
          # rather than a floating version so a Flutter release cannot turn a
          # green pipeline red overnight without a commit to point at.
          channel: stable
          cache: true

      - name: Toolchain identity
        # Printed because "which Flutter was this?" is the first question asked
        # of any mobile failure, and the answer must be in the log, not inferred.
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Localizations are up to date with the .arb files
        # lib/l10n/app_localizations*.dart is COMMITTED, not generated at build
        # time, so this does not produce them -- it checks that whoever last
        # edited an .arb file regenerated them. A stale generated file compiles
        # perfectly and ships the previous translation, which is the kind of
        # defect that reaches a parent rather than a build log.
        run: |
          flutter gen-l10n
          if ! git diff --quiet -- lib/l10n; then
            echo "::error::lib/l10n is stale — run 'flutter gen-l10n' and commit the result"
            git diff --stat -- lib/l10n
            exit 1
          fi

      - name: Analyze
        # analysis_options.yaml promotes a missing required param to an ERROR.
        run: flutter analyze --no-pub

      - name: Unit and widget tests
        # test/integration/live_backend_test.dart needs a running API. It skips
        # ITSELF when JAWWID_LIVE_API is unset rather than being excluded here,
        # so it costs nothing and starts working the moment an environment
        # exists. Nothing is set, so it skips -- and that skip is the honest
        # status of mobile integration testing (BLOCKER-1).
        run: flutter test --no-pub --reporter expanded

      - name: Build the Android APK (debug)
        # Compiling is a test the test suite does not perform: a widget test
        # exercises Dart, while this exercises the Gradle build, the plugin
        # registrations and the manifest -- which is where mobile builds
        # actually break.
        run: flutter build apk --debug
