# Jawwid Chat — CI
#
# Release gates are QA-owned (AI #5). The infrastructure jobs — configuration
# validation, container images, dependency audit — are AI #7's. AI #5 decides
# what must pass; AI #7 provides the pipeline that runs it.
#
# Ordered for fast feedback: cheap release-gate guards run first and fail the
# whole run in seconds, then per-package typecheck/tests, then the deeper
# migration gate that needs a database.
#
# Gate references are to docs/qa/release-gate.md.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow is triggered by pull_request, so it can be run
# by anyone able to open one. It reads; it never writes and never deploys.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------- fast gates
  guards:
    name: Release-gate guards (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: G-18 · no secrets committed
        run: |
          set -uo pipefail
          # Hard patterns: never legitimate anywhere in the tree.
          if grep -rInE '(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist . ; then
            echo "::error::G-18 FAIL — credential material committed"; exit 1
          fi
          # JWT-shaped strings, excluding test files. A synthetic token inside a
          # redaction test is the control working, not a leak (AI #3's
          # redacting_logger_test.dart asserts such a token never reaches a log),
          # so test paths are exempt from this heuristic only.
          if grep -rInE 'eyJhbGciOi[A-Za-z0-9_-]{10,}' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist \
               --exclude-dir=test --exclude-dir=tests \
               --exclude='*_test.dart' --exclude='*.spec.ts' --exclude='*.test.ts' . ; then
            echo "::error::G-18 FAIL — JWT-shaped credential committed outside a test"; exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production)$' ; then
            echo "::error::G-18 FAIL — a real .env file is tracked"; exit 1
          fi
          echo "G-18 pass"

      - name: G-20 · no real employee names in source, tests or seed data
        run: |
          set -uo pipefail
          # The product brief names real staff. They are acceptable in docs/,
          # never in code, fixtures or seed data (system-inventory.md §4).
          #
          # .github is excluded because the forbidden list is declared on the very
          # next line: without it the guard matches itself and can never pass, no
          # matter how clean the source tree is. The exclusion is the definition
          # site only -- application and test sources are still scanned.
          hits=$(grep -rIl $'رحاب\|زينب\|دينا\|أسماء\|مريم\|رضوى\|رقيه' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist \
            --exclude-dir=docs --exclude-dir=.github . || true)
          if [ -n "$hits" ]; then
            echo "::error::G-20 FAIL — real employee names outside docs/:"; echo "$hits"; exit 1
          fi
          echo "G-20 pass"

      # A guard that cannot pass is as useless as one that cannot fail. G-20 was
      # red on every commit because it matched its own definition, which took the
      # whole pipeline down with it; this proves both directions still hold.
      - name: G-20 meta-guard · the employee-name guard can pass, and can still fail
        run: bash scripts/qa/check-employee-name-guard.sh

      - name: JC-011 · protected regression tests must not be deleted or gutted
        run: bash scripts/qa/check-protected-tests.sh

      - name: G-31..G-35 · Phase 2 functionality must not ship in MVP
        run: |
          set -uo pipefail
          # Advisory scan. Fails only on unmistakable Phase 2 feature wiring.
          if grep -rInE '\b(videoCall|enableVideo|startVideo|broadcastToAll|aiScore|aiSuggest|draftWithAI)\b' \
               --include='*.ts' --include='*.dart' --include='*.tsx' \
               --exclude-dir=node_modules --exclude-dir=dist . ; then
            echo "::error::G-31..G-35 FAIL — Phase 2 capability referenced in MVP code"; exit 1
          fi
          echo "G-31..G-35 pass"

      # ---- infrastructure guardrails (AI #7) --------------------------------
      # Complementary to G-18 above, not a replacement: G-18 catches credential
      # material anywhere; these catch this project's specific failure modes.

      - name: Secret scan — worktree and history
        run: scripts/infra/scan-secrets.sh --history

      - name: Server secrets must not be reachable from a client bundle
        run: scripts/infra/check-web-env.sh

      - name: The local environment example is valid
        run: scripts/infra/check-env.sh local --file .env.example

      - name: Environment templates match the manifest
        # The templates are generated from infra/env/manifest.tsv. A
        # hand-edited template drifts from the checker that deployments run,
        # and the drift is only discovered by a failed release.
        run: |
          scripts/infra/render-env-template.sh staging    > /tmp/staging.env.example
          scripts/infra/render-env-template.sh production > /tmp/production.env.example
          diff -u infra/env/staging.env.example    /tmp/staging.env.example
          diff -u infra/env/production.env.example /tmp/production.env.example

      - name: The backup drill runs the pg_dump it is given
        # pg_dump refuses to dump from a server newer than itself, so PG_IMAGE
        # naming a client has to outrank whatever is on PATH. It did not: this
        # runner installs postgresql-client 16 for psql, so the G-19 backup
        # drill ran pg_dump 16 against the postgres:17 service and aborted,
        # with the documented remedy already applied and silently ignored.
        run: bash scripts/qa/check-backup-client-selection.sh

  # ------------------------------------------------------------------ backend
  api:
    name: API · typecheck + unit
    runs-on: ubuntu-latest
    needs: guards
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (incl. G-07 phone-privacy guard, G-04/G-44 authz)
        run: npm run test:unit

  # ---------------------------------------------------------------- admin web
  admin-web:
    name: Admin Web · typecheck + tests
    runs-on: ubuntu-latest
    needs: guards
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.ci.invalid/api/v1
          VITE_REALTIME_URL: wss://api.ci.invalid
          VITE_APP_ENV: ci

      - name: No credential reached the browser bundle
        working-directory: .
        run: scripts/infra/check-web-env.sh --bundle apps/admin-web/dist

  # --------------------------------------------------------------- migrations
  migrations:
    name: G-19 · migrations apply and are idempotent
    runs-on: ubuntu-latest
    needs: guards
    # The DB gates take ~45s and the integration suite about a minute. This is
    # deliberate headroom, not a guess: its job is to bound a hung service, and
    # a hang is exactly what happened here -- realtime-delivery.spec.ts opens
    # ioredis with `maxRetriesPerRequest: null`, so an unreachable Redis retries
    # forever rather than failing, and with no timeout the job sat until the
    # 6-hour default.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jawwid_chat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
      # redis:7-alpine matches docker-compose.yml, so CI and local development
      # run the same server.
      #
      # Mapped to 6410 because that is the endpoint realtime-delivery.spec.ts
      # asks for. That port is the test's own default and is deliberately
      # neither Redis's 6379 nor compose's 6380: it keeps a developer's own
      # Redis from quietly answering for the one the suite is supposed to
      # exercise. Honouring it here keeps that isolation instead of pointing the
      # suite at a shared port -- which is how this hang stayed invisible, since
      # it passed locally against an unrelated container listening on 6410.
      redis:
        image: redis:7-alpine
        ports: ['6410:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/jawwid_chat_test
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # RT-023. There is no branch composition and no Core/identity stub any
      # more: supabase/migrations is the single SQL authority and builds an
      # empty database on its own. Reintroducing a stub or a `git show` from
      # another branch here would restore the finding.
      - name: G-19 · migrations apply from an empty database
        run: bash scripts/db/apply.sh

      - name: G-19 · re-apply must be a no-op
        run: |
          out=$(bash scripts/db/apply.sh)
          echo "$out"
          if echo "$out" | grep -q '^  apply'; then
            echo "::error::G-19 FAIL — a migration re-applied on a clean ledger"; exit 1
          fi

      # RT-023 acceptance: every table, FK, trigger and index a running system
      # needs is present, and nothing from another product's database is.
      - name: G-19 · fresh-database schema acceptance
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/tests/schema_acceptance.sql

      # BR-2 and the identity foundation. 20260905090050 cited this file as the
      # guard on chat.account acquiring a contact channel; until PR-A it did not
      # exist, so the control was named in a comment and enforced nowhere.
      - name: Identity invariants (BR-2, teacher identity, connection roles)
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/tests/invariants.sql

      # RT-024 / RT-025. The BR-1 backstop, proven against the database with the
      # application entirely out of the picture. Do not weaken an assertion in
      # db/tests/br1_invariants.sql to make a change pass.
      - name: G-01 · BR-1 structural invariants (RT-024, RT-025)
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/tests/br1_invariants.sql

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Integration suite
        working-directory: apps/api
        run: |
          npm ci
          npx prisma generate
          npm run test:int

      # ---- AI #7 -----------------------------------------------------------
      - name: Backup drill against the current schema
        # A `chat`-only dump is NOT self-restorable while chat.core_* are views
        # over Core-owned tables in public: restore fails partway and looks like
        # it worked. This asserts the documented recovery procedure still holds
        # as the schema moves. See docs/infrastructure/backup-recovery.md.
        run: |
          APP_ENV=ci PG_IMAGE=postgres:17-alpine \
            scripts/infra/backup-db.sh --out ./backups --schema chat

  # ------------------------------------------------------------------- images
  # AI #7. Deployment artifacts must build, and must not run privileged.
  images:
    name: Container images build and run unprivileged
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        # Note: this regenerates the Prisma client from scratch, so it catches
        # schema/code drift that a local build hides behind a stale client.
        run: docker build -t jawwid-chat-api:${{ github.sha }} apps/api

      - name: The API image must not run as root
        run: |
          user="$(docker run --rm --entrypoint id jawwid-chat-api:${{ github.sha }} -un)"
          echo "image user: $user"
          [ "$user" != "root" ] || { echo "::error::API image runs as root"; exit 1; }

      - name: Build Admin Web image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://api.ci.invalid/api/v1 \
            --build-arg VITE_REALTIME_URL=wss://api.ci.invalid \
            -t jawwid-chat-admin:${{ github.sha }} apps/admin-web

  # ------------------------------------------------------------- dependencies
  # AI #7. Advisory: a transitive advisory with no fix available must not block
  # an unrelated bugfix. Promoting this to blocking is AI #5's gate decision.
  dependencies:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Audit — high and critical
        continue-on-error: true
        run: |
          for app in apps/api apps/admin-web; do
            echo "::group::$app"
            (cd "$app" && npm audit --audit-level=high) || true
            echo "::endgroup::"
          done

  # ------------------------------------------------------------------- mobile
  mobile:
    name: Mobile · BLOCKED (toolchain absent)
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - name: Report blocked status
        run: |
          echo "::warning::G-37 UNVERIFIED — Flutter/Dart is not installed on any"
          echo "::warning::build host, so no mobile unit, widget or integration test"
          echo "::warning::can execute. Parent and Teacher apps are untested by"
          echo "::warning::construction. See docs/qa/release-gate.md G-37."
