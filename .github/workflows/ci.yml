# Jawwid Chat — CI
#
# Release gates are QA-owned (AI #5). The infrastructure jobs — configuration
# validation, container images, dependency audit — are AI #7's. AI #5 decides
# what must pass; AI #7 provides the pipeline that runs it.
#
# Ordered for fast feedback: cheap release-gate guards run first and fail the
# whole run in seconds, then per-package typecheck/tests, then the deeper
# migration gate that needs a database.
#
# Gate references are to docs/qa/release-gate.md.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow is triggered by pull_request, so it can be run
# by anyone able to open one. It reads; it never writes and never deploys.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------- fast gates
  guards:
    name: Release-gate guards (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every step below is ONE call into scripts/qa/guards.sh, which holds the
      # patterns, exclusions and commands. Developers run the identical gates
      # before pushing with `bash scripts/qa/guards.sh`; a gate written inline
      # here would drift from that copy, and the copy that drifts is the one
      # nobody runs. The step names are the gate titles guards.sh prints.

      - name: G-18 · no secrets committed
        run: bash scripts/qa/guards.sh g18

      # The product brief names real staff: acceptable in docs/, never in code,
      # fixtures or seed data (system-inventory.md §4). The list lives in
      # guards.sh, and the scan is byte-exact python rather than grep: the old
      # GNU-grep one-liner fake-passed when run on a Mac (zsh rewrites `\|`
      # inside $'...'), so only CI ever caught a name.
      - name: G-20 · no real employee names in source, tests or seed data
        run: bash scripts/qa/guards.sh g20

      # A guard that cannot pass is as useless as one that cannot fail. G-20 was
      # red on every commit because it matched its own definition, which took the
      # whole pipeline down with it; this proves both directions still hold, for
      # every name on the list.
      - name: G-20 meta-guard · the employee-name guard can pass, and can still fail
        run: bash scripts/qa/guards.sh g20-meta

      - name: JC-011 · protected regression tests must not be deleted or gutted
        run: bash scripts/qa/guards.sh jc011

      - name: G-31..G-35 · Phase 2 functionality must not ship in MVP
        run: bash scripts/qa/guards.sh g31

      # ---- infrastructure guardrails (AI #7) --------------------------------
      # Complementary to G-18 above, not a replacement: G-18 catches credential
      # material anywhere; these catch this project's specific failure modes.

      - name: Secret scan — worktree and history
        run: bash scripts/qa/guards.sh secret-scan

      - name: Server secrets must not be reachable from a client bundle
        run: bash scripts/qa/guards.sh web-env

      - name: The local environment example is valid
        run: bash scripts/qa/guards.sh env-example

      - name: Environment templates match the manifest
        # The templates are generated from infra/env/manifest.tsv. A
        # hand-edited template drifts from the checker that deployments run,
        # and the drift is only discovered by a failed release.
        run: bash scripts/qa/guards.sh env-templates

      - name: Install doctl (offline app spec validation, no credentials)
        run: scripts/infra/install-doctl.sh

      - name: App Platform specs match the manifest and DigitalOcean's schema
        # ADR-008/ADR-009: .do/app.<env>.yaml is rendered from the manifest and
        # validated with `doctl apps spec validate --schema-only`.
        run: bash scripts/qa/guards.sh app-spec

      - name: The backup drill runs the pg_dump it is given
        # pg_dump refuses to dump from a server newer than itself, so PG_IMAGE
        # naming a client has to outrank whatever is on PATH. It did not: this
        # runner installs postgresql-client 16 for psql, so the G-19 backup
        # drill ran pg_dump 16 against the postgres:17 service and aborted,
        # with the documented remedy already applied and silently ignored.
        run: bash scripts/qa/guards.sh backup-client

      - name: Every gate in scripts/qa/guards.sh runs in CI
        # Anti-drift: fails if guards.sh defines a gate this job never calls.
        run: bash scripts/qa/guards.sh ci-wiring

      - name: Backups are encrypted, and restore refuses what it must
        # A backup is every family's messages. Without a database: no key
        # outside local/test/ci is refused before pg_dump runs, an encrypted
        # backup leaves no plaintext and no key, and a wrong key or a modified
        # archive is refused before the target is touched. The full round trip
        # against a real database is G-41 in the integration job.
        run: bash scripts/qa/guards.sh backup-encryption

  # ------------------------------------------------------------------ backend
  api:
    name: API · typecheck + unit
    runs-on: ubuntu-latest
    needs: guards
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (incl. G-07 phone-privacy guard, G-04/G-44 authz)
        run: npm run test:unit

  # ---------------------------------------------------------------- admin web
  admin-web:
    name: Admin Web · typecheck + tests
    runs-on: ubuntu-latest
    needs: guards
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.ci.invalid/api/v1
          VITE_REALTIME_URL: wss://api.ci.invalid
          VITE_APP_ENV: ci

      - name: No credential reached the browser bundle
        working-directory: .
        run: scripts/infra/check-web-env.sh --bundle apps/admin-web/dist

  # --------------------------------------------------------------- migrations
  migrations:
    name: G-19 · migrations apply and are idempotent
    runs-on: ubuntu-latest
    needs: guards
    # The DB gates take ~45s and the integration suite about a minute. This is
    # deliberate headroom, not a guess: its job is to bound a hung service, and
    # a hang is exactly what happened here -- realtime-delivery.spec.ts opens
    # ioredis with `maxRetriesPerRequest: null`, so an unreachable Redis retries
    # forever rather than failing, and with no timeout the job sat until the
    # 6-hour default.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jawwid_chat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
      # redis:7-alpine matches docker-compose.yml, so CI and local development
      # run the same server.
      #
      # Mapped to 6410 because that is the endpoint realtime-delivery.spec.ts
      # asks for. That port is the test's own default and is deliberately
      # neither Redis's 6379 nor compose's 6380: it keeps a developer's own
      # Redis from quietly answering for the one the suite is supposed to
      # exercise. Honouring it here keeps that isolation instead of pointing the
      # suite at a shared port -- which is how this hang stayed invisible, since
      # it passed locally against an unrelated container listening on 6410.
      redis:
        image: redis:7-alpine
        ports: ['6410:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/jawwid_chat_test
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # RT-023. There is no branch composition and no Core/identity stub any
      # more: supabase/migrations is the single SQL authority and builds an
      # empty database on its own. Reintroducing a stub or a `git show` from
      # another branch here would restore the finding.
      - name: G-19 · migrations apply from an empty database
        run: bash scripts/db/apply.sh

      - name: G-19 · re-apply must be a no-op
        run: |
          out=$(bash scripts/db/apply.sh)
          echo "$out"
          if echo "$out" | grep -q '^  apply'; then
            echo "::error::G-19 FAIL — a migration re-applied on a clean ledger"; exit 1
          fi

      # RT-023 acceptance: every table, FK, trigger and index a running system
      # needs is present, and nothing from another product's database is.
      - name: G-19 · fresh-database schema acceptance
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/tests/schema_acceptance.sql

      # BR-2 and the identity foundation. 20260905090050 cited this file as the
      # guard on chat.account acquiring a contact channel; until PR-A it did not
      # exist, so the control was named in a comment and enforced nowhere.
      - name: Identity invariants (BR-2, teacher identity, connection roles)
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/tests/invariants.sql

      # RT-024 / RT-025. The BR-1 backstop, proven against the database with the
      # application entirely out of the picture. Do not weaken an assertion in
      # db/tests/br1_invariants.sql to make a change pass.
      - name: G-01 · BR-1 structural invariants (RT-024, RT-025)
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/tests/br1_invariants.sql

      # Story RLS, run as `authenticated` so the policies are actually evaluated.
      # This suite is the reason the story child tables carry restrictive tenant
      # policies: it caught a publisher in one academy reading every other
      # academy's viewer and recipient rows. A policy no job executes is a policy
      # that rots, so it runs here rather than only on a laptop.
      - name: Story row-level security
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/tests/story_rls.sql
      # PD-6. The relationship predicate is the security boundary for the direct
      # teacher<->parent channel, so it is proven against the database with the
      # application out of the picture, exactly as BR-1 is above. While the
      # authorization switch is still pending, this suite ALSO asserts that the
      # old BR-1 denials remain in force -- so the two gates above and below
      # cannot silently diverge.
      - name: G-01 · PD-6 relationship predicate
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/tests/relationship_predicate.sql

      # Teacher Profile V2: a teacher owns their profile, can never decide their
      # own credential, and a retitled claim returns to pending -- proven as
      # `authenticated` against the database, with the application out of it.
      - name: Teacher professional profile row-level security
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f db/tests/teacher_profile_rls.sql

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Integration suite
        working-directory: apps/api
        run: |
          npm ci
          npx prisma generate
          npm run test:int

      # ---- AI #7 -----------------------------------------------------------
      - name: Backup drill against the current schema
        # A `chat`-only dump is NOT self-restorable while chat.core_* are views
        # over Core-owned tables in public: restore fails partway and looks like
        # it worked. This asserts the documented recovery procedure still holds
        # as the schema moves. See docs/infrastructure/backup-recovery.md.
        run: |
          APP_ENV=ci PG_IMAGE=postgres:17-alpine \
            scripts/infra/backup-db.sh --out ./backups --schema chat

      # G-41. The backup above proves pg_dump runs; it does not prove there is
      # anything to recover. This takes an ENCRYPTED backup the way production
      # does, proves the artefact holds no plaintext, proves a wrong key and a
      # modified archive are refused before the target is touched, then restores
      # into a database that did not exist and holds the copy to the same gates
      # a migrated database passes -- plus the two checks that caught every past
      # "restore that looked fine": identical per-table row counts, and the
      # application role reading the copy as itself.
      #
      # Synthetic data only. The key is generated here, lives in RUNNER_TEMP,
      # and is never printed.
      - name: G-41 · encrypted backup, refused tampering, restore and verify
        env:
          PG_IMAGE: postgres:17-alpine
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/g41"
          mkdir -p "$work"
          (umask 077; openssl rand -base64 48 > "$work/backup.key"; openssl rand -base64 48 > "$work/wrong.key")
          marker="g41-synthetic-$(openssl rand -hex 6)"
          psql -v ON_ERROR_STOP=1 -q "$DATABASE_URL" -c \
            "insert into chat.config (key, value, description) values ('ci.g41.marker', to_jsonb('$marker'::text), 'G-41 synthetic row')"

          # 1. No key outside local/test/ci: refused before pg_dump, nothing written.
          if APP_ENV=production scripts/infra/backup-db.sh --out "$work/refused" --schema chat; then
            echo "::error::G-41 FAIL — an unencrypted production backup was written"; exit 1
          fi
          [ ! -e "$work/refused" ] || { echo "::error::G-41 FAIL — the refused backup left files"; exit 1; }

          # 2. Encrypted backup, as production takes it.
          APP_ENV=production BACKUP_ENCRYPTION_KEY_FILE="$work/backup.key" \
            scripts/infra/backup-db.sh --out "$work/enc" --schema chat
          enc="$(ls "$work"/enc/*.dump.enc)"
          ls "$work/enc"

          # 3. No plaintext. The unencrypted archive from the step above is the
          #    positive control: the same greps DO find it there.
          plain="$(ls -t ./backups/*.dump | head -1)"
          for needle in PGDMP 'CREATE TABLE chat.'; do
            LC_ALL=C grep -a -q -F "$needle" "$plain" \
              || { echo "::error::G-41 positive control failed: '$needle' not in the plaintext archive"; exit 1; }
            if LC_ALL=C grep -a -q -F "$needle" "$work"/enc/*; then
              echo "::error::G-41 FAIL — '$needle' is readable in the encrypted backup"; exit 1
            fi
          done
          if LC_ALL=C grep -a -q -F -e "$marker" -e "$(head -1 "$work/backup.key")" "$work"/enc/*; then
            echo "::error::G-41 FAIL — the synthetic row or the key is readable in the backup"; exit 1
          fi
          if ls "$work/enc" | grep -v -E '\.dump\.enc(\.hmac|\.sha256)?$'; then
            echo "::error::G-41 FAIL — the encrypted backup left another file beside it"; exit 1
          fi

          psql -v ON_ERROR_STOP=1 -q "$DATABASE_URL" -c 'create database jawwid_chat_recovered'
          recovered="${DATABASE_URL%/*}/jawwid_chat_recovered"
          untouched() {
            [ "$(psql -tAX "$recovered" -c "select count(*) from pg_namespace where nspname = 'chat'")" = 0 ] \
              || { echo "::error::G-41 FAIL — a refused restore touched the target"; exit 1; }
          }

          # 4. A wrong key is refused, and the target is untouched.
          if BACKUP_ENCRYPTION_KEY_FILE="$work/wrong.key" \
               scripts/infra/restore-db.sh --file "$enc" --into "$recovered" --schema chat; then
            echo "::error::G-41 FAIL — restored with the wrong key"; exit 1
          fi
          untouched

          # 5. A modified archive is refused even when its .sha256 is rewritten
          #    to match -- the unkeyed checksum is not what protects it.
          mkdir -p "$work/tampered"
          cp "$enc" "$enc.hmac" "$work/tampered/"
          t="$work/tampered/$(basename "$enc")"
          dd if=/dev/urandom of="$t" bs=1 seek=$(( $(wc -c < "$t") / 2 )) count=16 conv=notrunc 2>/dev/null
          (cd "$work/tampered" && sha256sum "$(basename "$t")" > "$(basename "$t").sha256")
          if BACKUP_ENCRYPTION_KEY_FILE="$work/backup.key" \
               scripts/infra/restore-db.sh --file "$t" --into "$recovered" --schema chat; then
            echo "::error::G-41 FAIL — restored a modified archive"; exit 1
          fi
          untouched

          # 6. The real restore.
          BACKUP_ENCRYPTION_KEY_FILE="$work/backup.key" \
            scripts/infra/restore-db.sh --file "$enc" --into "$recovered" --schema chat

          # 7. The copy passes the gates a migrated database passes.
          for suite in schema_acceptance invariants br1_invariants tenant_isolation \
                       relationship_predicate story_rls teacher_profile_rls; do
            echo "::group::restored · $suite"
            psql -v ON_ERROR_STOP=1 "$recovered" -f "db/tests/$suite.sql"
            echo "::endgroup::"
          done

          # 8. Data, not just structure: every table's row count, the synthetic
          #    row, and the privilege model, identical to the source.
          counts="select string_agg(format('%s=%s', c.relname, (xpath('/row/n/text()', query_to_xml(format('select count(*) as n from chat.%I', c.relname), false, true, '')))[1]::text), ',' order by c.relname) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'chat' and c.relkind in ('r', 'p')"
          # NULL and an explicit owner-only ACL mean the same thing, and a dump
          # does not preserve which one a migration left; acldefault() compares
          # what is GRANTED rather than how it is spelled.
          acls="select md5((select coalesce(nspacl, acldefault('n', nspowner))::text from pg_namespace where nspname = 'chat') || string_agg(c.relname || ':' || coalesce(c.relacl, acldefault(case c.relkind when 'S' then 's' else 'r' end::\"char\", c.relowner))::text, '|' order by c.relname)) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'chat'"
          for check in counts acls; do
            src="$(psql -tAX "$DATABASE_URL" -c "${!check}")"
            dst="$(psql -tAX "$recovered" -c "${!check}")"
            [ "$src" = "$dst" ] || { echo "::error::G-41 FAIL — restored $check differ from the source"; diff <(tr ',' '\n' <<<"$src") <(tr ',' '\n' <<<"$dst") || true; exit 1; }
            echo "restored $check identical to the source"
          done
          got="$(psql -tAX "$recovered" -c "select value #>> '{}' from chat.config where key = 'ci.g41.marker'")"
          [ "$got" = "$marker" ] || { echo "::error::G-41 FAIL — the synthetic row did not survive"; exit 1; }

          # 9. The application role can USE the copy. A restore can pass every
          #    check above while chat_app has no USAGE on the schema; that is
          #    how the last two recovery defects hid. RLS applies, so compare
          #    what chat_app sees in the copy with what it sees in the source.
          psql -v ON_ERROR_STOP=1 -q "$DATABASE_URL" -c "alter role chat_app password 'g41-drill-only'"
          server="${DATABASE_URL#*@}"; server="${server%/*}"
          as_app() { PGPASSWORD=g41-drill-only psql -tAX "postgres://chat_app@$server/$1" -c 'select count(*) from chat.config'; }
          app_src="$(as_app "${DATABASE_URL##*/}")"
          app_dst="$(as_app jawwid_chat_recovered)" \
            || { echo "::error::G-41 FAIL — the application role cannot read the restored database"; exit 1; }
          [ "$app_src" = "$app_dst" ] \
            || { echo "::error::G-41 FAIL — chat_app sees $app_dst rows in the copy, $app_src in the source"; exit 1; }
          echo "chat_app reads the copy as itself ($app_dst rows under RLS, same as the source)"

  # ------------------------------------------------------------------- images
  # AI #7. Deployment artifacts must build, and must not run privileged.
  images:
    name: Container images build and run unprivileged
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        # Note: this regenerates the Prisma client from scratch, so it catches
        # schema/code drift that a local build hides behind a stale client.
        run: docker build -t jawwid-chat-api:${{ github.sha }} apps/api

      - name: The API image must not run as root
        run: |
          user="$(docker run --rm --entrypoint id jawwid-chat-api:${{ github.sha }} -un)"
          echo "image user: $user"
          [ "$user" != "root" ] || { echo "::error::API image runs as root"; exit 1; }

      - name: Build Admin Web image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://api.ci.invalid/api/v1 \
            --build-arg VITE_REALTIME_URL=wss://api.ci.invalid \
            -t jawwid-chat-admin:${{ github.sha }} apps/admin-web

  # ------------------------------------------------------------- dependencies
  # AI #7. Advisory: a transitive advisory with no fix available must not block
  # an unrelated bugfix. Promoting this to blocking is AI #5's gate decision.
  dependencies:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Audit — high and critical
        continue-on-error: true
        run: |
          for app in apps/api apps/admin-web; do
            echo "::group::$app"
            (cd "$app" && npm audit --audit-level=high) || true
            echo "::endgroup::"
          done

  # ------------------------------------------------------------------- mobile
  mobile:
    name: Mobile · BLOCKED (toolchain absent)
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - name: Report blocked status
        run: |
          echo "::warning::G-37 UNVERIFIED — Flutter/Dart is not installed on any"
          echo "::warning::build host, so no mobile unit, widget or integration test"
          echo "::warning::can execute. Parent and Teacher apps are untested by"
          echo "::warning::construction. See docs/qa/release-gate.md G-37."
