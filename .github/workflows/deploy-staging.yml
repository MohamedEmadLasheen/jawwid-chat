# Staging deployment. Owner: AI #7 (infrastructure).
#
# Manual only. The automatic push-to-main trigger was removed on 2026-10-06:
# staging had no deployment target (BLOCKER-1), so all 34 of its push-triggered
# runs failed -- and a deployment workflow that is red on every single merge
# teaches everyone to ignore the one signal that should mean something.
#
# The target is DigitalOcean App Platform (ADR-010). The app is described by
# .do/app.staging.yaml (rendered from infra/env/manifest.tsv, ADR-008/ADR-009),
# and the Release step deploys it with doctl. Until the owner steps in
# docs/infrastructure/production-readiness.md are done, a run still FAILS, and
# fails before it changes anything: the deploy credentials are checked first.
#
# Repository variables this file reads (Settings -> Variables):
#   STAGING_API_BASE_URL    the API ORIGIN, https://api.staging.<domain> (no path;
#                           the Admin Web build appends /api/v1)
#   STAGING_REALTIME_URL    wss://api.staging.<domain>
#   STAGING_ADMIN_WEB_URL   https://admin.staging.<domain>
#   STAGING_CORS_ALLOWED_ORIGINS
# Everything else comes from the `staging` GitHub Environment, under the
# manifest's own variable names.
#
# Kept separate from ci.yml on purpose: pull_request workflows can be triggered
# by anyone who can open a pull request, and must never have access to a
# deployment credential. Nothing in this file runs on a pull request.
name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag (a commit SHA) to deploy (blank = build from this commit). Use this to roll back.'
        required: false
        type: string
      first_deploy:
        description: 'Create the App Platform app (once, before DIGITALOCEAN_APP_ID exists). Refused if the app id is already set.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# Never two staging deployments at once, and never cancel one midway: an
# interrupted deployment leaves the environment in a state nobody chose.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP_ENV: staging

jobs:
  build:
    name: Build and publish images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      admin_web_tag: ${{ steps.meta.outputs.admin_web_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Resolve release identity
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "reusing existing image ${{ inputs.image_tag }}"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
          # The Admin Web image is per environment (ADR-006), so its tag says so.
          echo "admin_web_tag=staging-${{ inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        if: inputs.image_tag == ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        if: inputs.image_tag == ''
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}/api"
          # Build identity is baked in so /health/live can answer
          # "what is running?" without consulting the pipeline.
          docker build \
            --build-arg NODE_ENV=production \
            -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:staging" \
            apps/api
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:staging"

      - name: Install Flutter for the teacher web portal (PD-28)
        if: inputs.image_tag == ''
        # Pinned to the version pubspec.yaml is developed against, from
        # Flutter's own repository; no third-party action.
        run: |
          git clone --quiet --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Build and push Admin Web image
        if: inputs.image_tag == ''
        env:
          API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          REALTIME_URL: ${{ vars.STAGING_REALTIME_URL }}
          # PD-29 audio: the lessons site's origin, compiled into Admin Web and the
          # teacher web portal. Unset = no lesson is handed Quran audio.
          LESSONS_ORIGIN: ${{ vars.STAGING_LESSONS_ORIGIN }}
        run: |
          test -n "$API_BASE_URL" || { echo "::error::vars.STAGING_API_BASE_URL is not set"; exit 1; }
          # The variable is the API ORIGIN: the smoke test probes
          # $STAGING_API_BASE_URL/health/live, which is outside /api/v1.
          case "$API_BASE_URL" in
            https://*) : ;;
            *) echo "::error::vars.STAGING_API_BASE_URL must be an https:// origin"; exit 1 ;;
          esac
          host="${API_BASE_URL#https://}"
          case "${host%/}" in
            */*) echo "::error::vars.STAGING_API_BASE_URL must be the API origin, with no path"; exit 1 ;;
          esac
          # Both are compiled into the bundle. Unguarded, a missing realtime URL
          # builds and ships a staging Admin Web that silently cannot connect.
          test -n "$REALTIME_URL" || { echo "::error::vars.STAGING_REALTIME_URL is not set"; exit 1; }
          # PD-28: the teacher web portal -- the Flutter app built for the browser
          # against the same API -- goes into the image under /teacher/. Built
          # before the image because it needs the repository root.
          FLUTTER="$RUNNER_TEMP/flutter/bin/flutter" \
            scripts/mobile/build-teacher-web.sh "${API_BASE_URL%/}/api/v1"
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}/admin-web"
          # These values are compiled into the browser bundle, so the image is
          # environment-specific and is never promoted to production.
          docker build \
            --build-arg VITE_API_BASE_URL="${API_BASE_URL%/}/api/v1" \
            --build-arg VITE_REALTIME_URL="$REALTIME_URL" \
            --build-arg VITE_APP_ENV=staging \
            --build-arg VITE_GIT_COMMIT="${GITHUB_SHA}" \
            --build-arg VITE_LESSONS_ORIGIN="$LESSONS_ORIGIN" \
            -t "$IMAGE:staging-${GITHUB_SHA}" -t "$IMAGE:staging" \
            apps/admin-web
          docker push "$IMAGE:staging-${GITHUB_SHA}"
          docker push "$IMAGE:staging"

  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [build]
    # The GitHub Environment holds the staging secrets and any protection rules.
    # Secrets are scoped to it, so no other workflow or job can read them.
    environment:
      name: staging
      url: ${{ vars.STAGING_ADMIN_WEB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit being released, so the migrations and the app spec are
          # the ones that image was built with -- also when rolling back.
          ref: ${{ needs.build.outputs.image_tag }}

      - name: The deploy credentials are present
        # FIRST, before the backup and the migrations: a run that migrates the
        # database and then cannot release leaves a new schema under old code.
        # Fails loudly, never a silent no-op (ADR-003).
        env:
          HAS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN != '' }}
          HAS_APP_ID: ${{ secrets.DIGITALOCEAN_APP_ID != '' }}
          HAS_PULL: ${{ secrets.GHCR_PULL_CREDENTIALS != '' }}
          FIRST_DEPLOY: ${{ inputs.first_deploy }}
        run: |
          rc=0
          [ "$HAS_TOKEN" = "true" ] || { echo "::error title=Deploy credentials::DIGITALOCEAN_ACCESS_TOKEN is not set in the staging GitHub Environment"; rc=1; }
          [ "$HAS_PULL" = "true" ] || { echo "::error title=Deploy credentials::GHCR_PULL_CREDENTIALS (user:token with read:packages) is not set in the staging GitHub Environment"; rc=1; }
          if [ "$FIRST_DEPLOY" = "true" ]; then
            [ "$HAS_APP_ID" = "false" ] || { echo "::error title=Deploy credentials::first_deploy=true but DIGITALOCEAN_APP_ID is already set; refusing to create a second app"; rc=1; }
          else
            [ "$HAS_APP_ID" = "true" ] || { echo "::error title=Deploy credentials::DIGITALOCEAN_APP_ID is not set in the staging GitHub Environment (first time: run with first_deploy=true)"; rc=1; }
          fi
          [ "$rc" -eq 0 ] || echo "Nothing was changed. Owner steps: docs/infrastructure/production-readiness.md"
          exit "$rc"

      - name: Install doctl
        run: scripts/infra/install-doctl.sh

      - name: Validate the staging configuration and resolve the app spec
        # Runs BEFORE anything is changed. A missing or placeholder value stops
        # the deployment here rather than halfway through it. The same values
        # fill .do/app.staging.yaml; every manifest variable is listed, so
        # setting a variable or secret of that name in the `staging` GitHub
        # Environment is all it takes to configure it (the `app-spec` guard
        # fails CI if one is missing here). The resolved spec holds secrets: it
        # is written mode 600 under RUNNER_TEMP and removed at the end.
        env:
          NODE_ENV: production
          APP_ENV: staging
          # Proxies in front of the API on App Platform. Measure it on the live
          # app; a guessed count lets clients choose their own address
          # (apps/api/src/platform/auth/client-address.ts).
          TRUSTED_PROXY_HOPS: ${{ vars.TRUSTED_PROXY_HOPS }}
          PORT: '3000'
          LOG_LEVEL: info
          CORS_ALLOWED_ORIGINS: ${{ vars.STAGING_CORS_ALLOWED_ORIGINS }}
          REQUEST_TIMEOUT_MS: '30000'
          SHUTDOWN_GRACE_MS: '15000'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_STATEMENT_TIMEOUT_MS: '15000'
          DATABASE_POOL_MAX: '10'
          REDIS_URL: ${{ secrets.REDIS_URL }}
          QUEUE_PREFIX: jawwid-chat-staging
          WORKER_CONCURRENCY: '5'
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          RESET_CODE_HASH_SECRET: ${{ secrets.RESET_CODE_HASH_SECRET }}
          JWT_ACCESS_TTL: 15m
          JWT_REFRESH_TTL: 30d
          STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
          STORAGE_REGION: ${{ vars.STORAGE_REGION || 'auto' }}
          STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          STORAGE_SIGNED_URL_TTL_SECONDS: '300'
          STORAGE_SIGNING_SECRET: ${{ secrets.STORAGE_SIGNING_SECRET }}
          MEDIA_PUBLIC_BASE_URL: ${{ vars.MEDIA_PUBLIC_BASE_URL }}
          MATERIALS_SITE_BASE_URL: ${{ vars.MATERIALS_SITE_BASE_URL }}
          MATERIALS_FRAME_ORIGINS: ${{ vars.MATERIALS_FRAME_ORIGINS }}
          STORAGE_LOCAL_ROOT: ${{ vars.STORAGE_LOCAL_ROOT }}
          STORAGE_PUBLIC_BASE_URL: ${{ vars.STORAGE_PUBLIC_BASE_URL }}
          OUTBOX_POLL_MS: ${{ vars.OUTBOX_POLL_MS }}
          OUTBOX_BATCH_SIZE: ${{ vars.OUTBOX_BATCH_SIZE }}
          OUTBOX_IDLE_BACKOFF_MS: ${{ vars.OUTBOX_IDLE_BACKOFF_MS }}
          ATTACHMENT_MAX_BYTES_IMAGE: ${{ vars.ATTACHMENT_MAX_BYTES_IMAGE }}
          ATTACHMENT_MAX_BYTES_VIDEO: ${{ vars.ATTACHMENT_MAX_BYTES_VIDEO }}
          ATTACHMENT_MAX_BYTES_VOICE: ${{ vars.ATTACHMENT_MAX_BYTES_VOICE }}
          ATTACHMENT_MAX_BYTES_FILE: ${{ vars.ATTACHMENT_MAX_BYTES_FILE }}
          ATTACHMENT_MAX_VOICE_DURATION_MS: ${{ vars.ATTACHMENT_MAX_VOICE_DURATION_MS }}
          FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
          APNS_BUNDLE_ID: ${{ vars.APNS_BUNDLE_ID }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          APNS_PRODUCTION: 'false'
          # A URL, not a secret -- but the staging Environment was provisioned
          # (2026-09-24) with it as a secret, so either is accepted.
          LIVEKIT_URL: ${{ vars.LIVEKIT_URL || secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          CORE_BASE_URL: ${{ vars.CORE_BASE_URL }}
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          CORE_WEBHOOK_SECRET: ${{ secrets.CORE_WEBHOOK_SECRET }}
          CORE_TIMEOUT_MS: '5000'
          CORE_RETRY_MAX: '3'
          TEACHER_PAYOUT_KEYS: ${{ secrets.TEACHER_PAYOUT_KEYS }}
          # PD-25 parent self-recovery: each channel stays off until all of its variables are set.
          SMTP_URL: ${{ secrets.SMTP_URL }}
          RECOVERY_MAIL_FROM: ${{ vars.RECOVERY_MAIL_FROM }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_RECOVERY_TEMPLATE: ${{ vars.WHATSAPP_RECOVERY_TEMPLATE }}
          WHATSAPP_TEMPLATE_LANGUAGE: ${{ vars.WHATSAPP_TEMPLATE_LANGUAGE }}
          WHATSAPP_API_VERSION: ${{ vars.WHATSAPP_API_VERSION }}
          # Writes recovery codes to the API log instead of sending them; QA only, forbidden in production.
          RECOVERY_DELIVERY_LOG: ${{ vars.RECOVERY_DELIVERY_LOG }}
          # PD-27: card payments (optional; unset = no card option, bank transfer
          # and cash still work) and the public origin payment links point at.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PAYMENT_LINK_BASE_URL: ${{ vars.PAYMENT_LINK_BASE_URL }}
          # PD-30: the payment lock is on in staging, off in production until the owner
          # sets the production variable to 'true'.
          SUBSCRIPTION_LOCK_ENFORCED: ${{ vars.SUBSCRIPTION_LOCK_ENFORCED || 'true' }}
          # PD-35: strict teacher-supervisor scope is off everywhere until the owner sets
          # the variable to 'true' (department head, 2026-10-26).
          TEACHER_SUPERVISOR_STRICT_SCOPE: ${{ vars.TEACHER_SUPERVISOR_STRICT_SCOPE || 'false' }}
          # PD-42: NOT defaulted -- unset keeps the value stored in chat.config.
          SALES_FAMILY_SCOPE: ${{ vars.SALES_FAMILY_SCOPE }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          OTEL_SERVICE_NAME: jawwid-chat-api
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_TRACES_SAMPLER_ARG: ${{ vars.OTEL_TRACES_SAMPLER_ARG }}
          HEALTH_PROBE_TIMEOUT_MS: ${{ vars.HEALTH_PROBE_TIMEOUT_MS }}
          # The commit being released, which is not this run's commit on a
          # rollback. /health/live reports it, and the smoke test checks it.
          GIT_COMMIT: ${{ needs.build.outputs.image_tag }}
          BUILD_VERSION: staging-${{ github.run_number }}
          BUILD_TIME: ${{ github.event.repository.updated_at }}
          PRISMA_MIGRATE_SKIP_GENERATE: ${{ vars.PRISMA_MIGRATE_SKIP_GENERATE }}
          # --- the app spec only (not the API process) ---
          API_IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          ADMIN_WEB_IMAGE_TAG: ${{ needs.build.outputs.admin_web_tag }}
          GHCR_PULL_CREDENTIALS: ${{ secrets.GHCR_PULL_CREDENTIALS }}
          # The hosts the app serves are derived from these two URLs.
          ADMIN_WEB_URL: ${{ vars.STAGING_ADMIN_WEB_URL }}
          # Admin Web's CSP origins (apps/admin-web/infra-nginx/default.conf.template).
          API_ORIGIN: ${{ vars.STAGING_API_BASE_URL }}
          REALTIME_ORIGIN: ${{ vars.STAGING_REALTIME_URL }}
          LIVEKIT_ORIGIN: ${{ vars.LIVEKIT_URL || secrets.LIVEKIT_URL }}
          STORAGE_ORIGIN: ${{ vars.STORAGE_ENDPOINT }}
        run: |
          scripts/infra/check-env.sh staging
          python3 scripts/infra/app-spec.py resolve staging --out "$RUNNER_TEMP/app-spec.yaml"

      - name: Preflight the database role capability
        # BEFORE the backup and BEFORE any migration. 20260910120200 grants
        # BYPASSRLS, which not every managed PostgreSQL permits; without this
        # the run fails at the seventeenth migration with the database half
        # applied. Changes nothing -- the probe is rolled back.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: scripts/db/preflight-role-capability.sh

      - name: Back up the database before migrating
        # Encrypted: without the secret, backup-db.sh refuses before pg_dump
        # runs and the deployment stops before any migration. Keep a copy of
        # the passphrase outside GitHub; secrets here are write-only.
        env:
          APP_ENV: staging
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: scripts/infra/backup-db.sh --out ./backups --schema chat

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # AI #1's migration runner is the single migration authority.
          PSQL="psql -v ON_ERROR_STOP=1 $DATABASE_URL" scripts/db/apply.sh

      - name: Load the pinned Quran text
        # docs/product/quran-dataset-contract.md: after the migrations, from
        # this checkout (never inside the API image). The loader refuses a file
        # whose SHA-256 is not the pinned one, a count mismatch, a split or
        # empty ayah, and writes all or nothing; a dataset already loaded with
        # the same fingerprints is skipped. No dataset vendored: nothing to do.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          PSQL="psql -v ON_ERROR_STOP=1 $DATABASE_URL" scripts/db/load-quran.sh

      - name: Release
        # Deploys the resolved .do/app.staging.yaml with doctl and fails unless
        # the ACTIVE deployment then runs exactly these image tags. Refuses,
        # loudly, without the token or the app id (ADR-003).
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DIGITALOCEAN_APP_ID: ${{ secrets.DIGITALOCEAN_APP_ID }}
          DIGITALOCEAN_PROJECT_ID: ${{ vars.DIGITALOCEAN_PROJECT_ID }}
          FIRST_DEPLOY: ${{ inputs.first_deploy }}
          API_IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          ADMIN_WEB_IMAGE_TAG: ${{ needs.build.outputs.admin_web_tag }}
        run: scripts/infra/do-release.sh staging "$RUNNER_TEMP/app-spec.yaml"

      - name: Smoke test
        if: success()
        run: |
          scripts/infra/smoke.sh "${{ vars.STAGING_API_BASE_URL }}" \
            --web "${{ vars.STAGING_ADMIN_WEB_URL }}"

      - name: Remove the resolved app spec
        if: always()
        run: rm -f "$RUNNER_TEMP/app-spec.yaml"
