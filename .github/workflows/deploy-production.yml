# Production deployment. Owner: AI #7 (infrastructure).
#
# MANUAL ONLY. There is no automatic path from a merge to production: someone
# decides, and that decision is recorded against a specific commit.
#
# Protection is enforced by the `production` GitHub Environment (required
# reviewers, and a branch restriction to main). That is repository
# configuration, not something this file can assert -- see
# docs/infrastructure/production-readiness.md, which lists it as a gate.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy. A commit SHA already built and verified on staging. Use a previous tag to roll back.'
        required: true
        type: string
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # ONE definition, inherited by both validation steps below. The worker
  # manifest requires it BYTE-IDENTICAL to the API's: it namespaces the Redis
  # pub/sub channel, pub/sub is global to the Redis SERVER rather than to the
  # selected database, and a mismatch is silent -- the worker publishes to a
  # channel no API instance is listening on, so events are "delivered" and
  # nobody receives them. Defined once so the two cannot drift.
  QUEUE_PREFIX: jawwid-chat-production

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - name: Confirmation
        run: |
          [ "${{ inputs.confirm }}" = "DEPLOY" ] || {
            echo "::error::Confirmation text did not match. Nothing was deployed."
            exit 1
          }

      - uses: actions/checkout@v4

      - name: The tag must be an ancestor of main
        # Blocks deploying a commit that was never merged and never reviewed.
        run: |
          git fetch --depth=200 origin main
          if ! git merge-base --is-ancestor "${{ inputs.image_tag }}" origin/main; then
            echo "::error::${{ inputs.image_tag }} is not on main. Production deploys reviewed commits only."
            exit 1
          fi

  build:
    name: Verify the API image
    runs-on: ubuntu-latest
    needs: [preflight]
    # Read-only, and deliberately so. Resolving a digest READS a manifest;
    # nothing is pushed from this workflow. A run that can migrate and release
    # production must not also be able to overwrite the image it deploys.
    permissions:
      contents: read
      packages: read
    outputs:
      api_digest: ${{ steps.api.outputs.api_digest }}
    env:
      # Job-scoped on purpose. The workflow-level env is inherited by the
      # validation steps and graded against the application manifests
      # (scripts/qa/check-deploy-env.sh); a PIPELINE variable declared up there
      # would be read as an application variable that no manifest names, and
      # the contract guard would reject it -- correctly.
      REGISTRY: ghcr.io
    steps:
      # The commit under deployment, not the default ref. This job must reason
      # about the tag being released and nothing else.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: api
        name: Resolve the API image to an immutable digest
        # The API image is PROMOTED, never rebuilt here. Its identity is supplied
        # at RUNTIME -- GIT_COMMIT, BUILD_VERSION and BUILD_TIME are required
        # manifest rows read by build-info.ts, and apps/api/Dockerfile declares
        # no ARG for any of them -- so one image is environment-independent, and
        # the bytes production runs are the bytes staging tested. Rebuilding
        # would produce a different artifact from the same source and quietly
        # give up that guarantee.
        #
        # It also asks a question this pipeline never asked: does the image
        # exist at all? Until now production would back up and MIGRATE the
        # database on the way to releasing a tag nobody had checked was built.
        # A tag is mutable; a digest is not, so what the release step receives
        # cannot change under it between here and the deploy.
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}/api"
          digest="$(docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" \
                      --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          # One failure path for "no such image", "no such tag", an auth failure
          # and an unexpected output shape alike. An empty or malformed digest
          # must never reach the release step as though it were a real one.
          #
          # [[ =~ ]] and not grep: grep anchors per LINE, so output carrying a
          # warning above or below the digest would pass, and the whole
          # multi-line string would then be written as api_digest=... -- which is
          # malformed for $GITHUB_OUTPUT and can inject a second output. Bash
          # anchors ^ and $ to the whole string, so any newline fails closed.
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error title=API image not found::No image at $IMAGE:$IMAGE_TAG. Production promotes an image staging already built and tested; build it on staging first."
            exit 1
          }
          echo "api_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$IMAGE_TAG resolves to $digest"

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [preflight, build]
    environment:
      name: production
      url: ${{ vars.PRODUCTION_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}

      - name: Validate the production configuration
        env:
          NODE_ENV: production
          APP_ENV: production
          PORT: '3000'
          LOG_LEVEL: info
          CORS_ALLOWED_ORIGINS: ${{ vars.PRODUCTION_CORS_ALLOWED_ORIGINS }}
          REQUEST_TIMEOUT_MS: '30000'
          SHUTDOWN_GRACE_MS: '15000'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_STATEMENT_TIMEOUT_MS: '15000'
          DATABASE_POOL_MAX: '20'
          REDIS_URL: ${{ secrets.REDIS_URL }}
          WORKER_CONCURRENCY: '10'
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_ACCESS_TTL: 15m
          JWT_REFRESH_TTL: 30d
          STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
          STORAGE_REGION: auto
          STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          STORAGE_SIGNED_URL_TTL_SECONDS: '300'
          STORAGE_SIGNING_SECRET: ${{ secrets.STORAGE_SIGNING_SECRET }}
          FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
          APNS_BUNDLE_ID: ${{ vars.APNS_BUNDLE_ID }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          # Sandbox APNs silently drops production device tokens.
          APNS_ENVIRONMENT: production
          LIVEKIT_URL: ${{ vars.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          LIVEKIT_TOKEN_TTL_SECONDS: '300'
          CORE_BASE_URL: ${{ vars.CORE_BASE_URL }}
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          CORE_WEBHOOK_SECRET: ${{ secrets.CORE_WEBHOOK_SECRET }}
          CORE_TIMEOUT_MS: '5000'
          CORE_RETRY_MAX: '3'
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          OTEL_SERVICE_NAME: jawwid-chat-api
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          GIT_COMMIT: ${{ inputs.image_tag }}
          BUILD_VERSION: production-${{ github.run_number }}
          BUILD_TIME: ${{ github.event.repository.updated_at }}
        run: scripts/infra/check-env.sh production

      - name: Validate the worker configuration
        # The worker is a DIFFERENT process with a DIFFERENT contract
        # (infra/env/worker.manifest.tsv). The two manifests state OPPOSITE
        # rules for the same database variables, so the component is STATED
        # rather than inferred -- grading the worker against the API's contract
        # would demand a credential it must not hold, and grading the API
        # against the worker's would demand a BYPASSRLS one.
        #
        # DATABASE_SERVICE_URL (chat_service, BYPASSRLS), never DATABASE_URL.
        # Connected as chat_app the worker still CLAIMS outbox rows -- that
        # table carries a blanket policy -- but every read it needs in order to
        # route what it claimed returns nothing, so it marks each row published
        # and delivers it to nobody, with no error anywhere. DATABASE_URL and
        # DATABASE_MIGRATION_URL are both FORBIDDEN here, which is why neither
        # appears below; the runtime refuses to fall back (platform/database-role.ts)
        # and then asks the database which role it really got.
        #
        # No PORT and no CORS_ALLOWED_ORIGINS: this process starts no HTTP
        # server and must not hold a port. No WORKER_CONCURRENCY: despite the
        # name it configures nothing here -- the loop is sequential.
        #
        # QUEUE_PREFIX is INHERITED from the workflow env above rather than
        # restated, so the API's value and the worker's cannot drift.
        env:
          NODE_ENV: production
          APP_ENV: production
          SHUTDOWN_GRACE_MS: '15000'
          DATABASE_SERVICE_URL: ${{ secrets.DATABASE_SERVICE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
          STORAGE_REGION: auto
          STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          STORAGE_SIGNED_URL_TTL_SECONDS: '300'
          STORAGE_SIGNING_SECRET: ${{ secrets.STORAGE_SIGNING_SECRET }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
          APNS_BUNDLE_ID: ${{ vars.APNS_BUNDLE_ID }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          APNS_ENVIRONMENT: production
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GIT_COMMIT: ${{ inputs.image_tag }}
        run: scripts/infra/check-env.sh production --component worker

      - name: Back up the database
        # Before migrations, every time, no exceptions. This is the artifact the
        # rollback procedure depends on; a migration that drops a column cannot
        # be undone by redeploying the previous image.
        env:
          APP_ENV: production
          # The owner credential: pg_dump of a schema chat_app does not own
          # would silently produce an incomplete backup.
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: scripts/infra/backup-db.sh --out ./backups --schema chat

      - name: Upload the pre-deployment backup
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-backup-${{ github.run_number }}
          path: backups/
          retention-days: 30

      - name: Apply database migrations
        # DATABASE_MIGRATION_URL, not DATABASE_URL.
        #
        # Migrations need DDL, so they run as the schema OWNER. The API runs as
        # chat_app, which owns nothing and cannot bypass RLS -- that is the
        # whole of the Phase 1 deployment prerequisite. Using one secret for
        # both would force a choice between "migrations fail" and "the
        # application runs as owner and every RLS policy is inert", and the
        # second failure is silent.
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: |
          test -n "$DATABASE_MIGRATION_URL" || {
            echo "::error title=Missing migration credential::secrets.DATABASE_MIGRATION_URL is not set. It is the schema owner; DATABASE_URL is chat_app and cannot run DDL. See docs/recovery/PHASE-1-REPORT.md section 11."
            exit 1
          }
          PSQL="psql -v ON_ERROR_STOP=1 $DATABASE_MIGRATION_URL" scripts/db/apply.sh

      - name: Release
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          API_DIGEST: ${{ needs.build.outputs.api_digest }}
        run: |
          # ------------------------------------------------------------------
          # NOT YET IMPLEMENTED -- no production hosting has been provisioned.
          # Fails loudly on purpose. See deploy-staging.yml for the rationale.
          # ------------------------------------------------------------------
          echo "::error title=Deployment target not configured::No production host exists yet. See docs/infrastructure/production-readiness.md (BLOCKER-1)."
          exit 1

      - name: Smoke test
        if: success()
        run: |
          scripts/infra/smoke.sh "${{ vars.PRODUCTION_API_BASE_URL }}" \
            --web "${{ vars.PRODUCTION_ADMIN_WEB_URL }}"

      - name: Record the release
        if: success()
        run: |
          {
            echo "### Production release"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| commit | \`${{ inputs.image_tag }}\` |"
            echo "| api image | \`${{ needs.build.outputs.api_digest }}\` |"
            echo "| run | ${{ github.run_number }} |"
            echo "| deployed by | ${{ github.actor }} |"
            echo "| at | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
          } >> "$GITHUB_STEP_SUMMARY"
