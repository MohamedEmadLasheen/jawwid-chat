# Production deployment. Owner: AI #7 (infrastructure).
#
# MANUAL ONLY. There is no automatic path from a merge to production: someone
# decides, and that decision is recorded against a specific commit.
#
# Protection is enforced by the `production` GitHub Environment (required
# reviewers, and a branch restriction to main). That is repository
# configuration, not something this file can assert -- see
# docs/infrastructure/production-readiness.md, which lists it as a gate.
#
# The target is DigitalOcean App Platform (ADR-010), described by
# .do/app.production.yaml and released with doctl. The API image is the one
# staging built and tested for this commit; Admin Web is REBUILT here with the
# production URLs, because its URLs are compiled into the bundle (ADR-006).
#
# Repository variables this file reads (Settings -> Variables):
#   PRODUCTION_API_BASE_URL   the API ORIGIN, https://api.<domain> (no path)
#   PRODUCTION_REALTIME_URL   wss://api.<domain>
#   PRODUCTION_ADMIN_WEB_URL  https://admin.<domain>
#   PRODUCTION_CORS_ALLOWED_ORIGINS
# Everything else comes from the `production` GitHub Environment, under the
# manifest's own variable names.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy. A commit SHA already built and verified on staging. Use a previous tag to roll back.'
        required: true
        type: string
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true
        type: string
      first_deploy:
        description: 'Create the App Platform app (once, before DIGITALOCEAN_APP_ID exists). Refused if the app id is already set.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - name: Confirmation
        run: |
          [ "${{ inputs.confirm }}" = "DEPLOY" ] || {
            echo "::error::Confirmation text did not match. Nothing was deployed."
            exit 1
          }

      - uses: actions/checkout@v4

      - name: The tag must be an ancestor of main
        # Blocks deploying a commit that was never merged and never reviewed.
        run: |
          git fetch --depth=200 origin main
          if ! git merge-base --is-ancestor "${{ inputs.image_tag }}" origin/main; then
            echo "::error::${{ inputs.image_tag }} is not on main. Production deploys reviewed commits only."
            exit 1
          fi

  build-admin-web:
    name: Build the production Admin Web image
    runs-on: ubuntu-latest
    needs: [preflight]
    permissions:
      contents: read
      packages: write
    outputs:
      admin_web_tag: ${{ steps.build.outputs.admin_web_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The API image for this commit exists
        # Production deploys what staging built and tested; it never builds the
        # API itself. A tag staging never built stops here, before anything.
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/api:${{ inputs.image_tag }}"
          docker buildx imagetools inspect "$IMAGE" >/dev/null \
            || { echo "::error::$IMAGE does not exist -- deploy this commit to staging first"; exit 1; }

      - name: Install Flutter for the teacher web portal (PD-28)
        # Pinned to the version pubspec.yaml is developed against, from
        # Flutter's own repository; no third-party action.
        run: |
          git clone --quiet --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - id: build
        name: Build and push the Admin Web image
        env:
          API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
          REALTIME_URL: ${{ vars.PRODUCTION_REALTIME_URL }}
          TAG: ${{ inputs.image_tag }}
        run: |
          test -n "$API_BASE_URL" || { echo "::error::vars.PRODUCTION_API_BASE_URL is not set"; exit 1; }
          test -n "$REALTIME_URL" || { echo "::error::vars.PRODUCTION_REALTIME_URL is not set"; exit 1; }
          case "$API_BASE_URL" in
            https://*) : ;;
            *) echo "::error::vars.PRODUCTION_API_BASE_URL must be an https:// origin"; exit 1 ;;
          esac
          host="${API_BASE_URL#https://}"
          case "${host%/}" in
            */*) echo "::error::vars.PRODUCTION_API_BASE_URL must be the API origin, with no path"; exit 1 ;;
          esac
          # PD-28: the teacher web portal -- the Flutter app built for the browser
          # against the same API -- goes into the image under /teacher/. Built
          # before the image because it needs the repository root.
          FLUTTER="$RUNNER_TEMP/flutter/bin/flutter" \
            scripts/mobile/build-teacher-web.sh "${API_BASE_URL%/}/api/v1"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/admin-web"
          # Rebuilt on every production deploy, rollbacks included (ADR-006,
          # ADR-011): the bundle carries the production URLs.
          docker build \
            --build-arg VITE_API_BASE_URL="${API_BASE_URL%/}/api/v1" \
            --build-arg VITE_REALTIME_URL="$REALTIME_URL" \
            --build-arg VITE_APP_ENV=production \
            --build-arg VITE_GIT_COMMIT="$TAG" \
            -t "$IMAGE:production-$TAG" \
            apps/admin-web
          docker push "$IMAGE:production-$TAG"
          echo "admin_web_tag=production-$TAG" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [preflight, build-admin-web]
    environment:
      name: production
      url: ${{ vars.PRODUCTION_ADMIN_WEB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}

      - name: The deploy credentials are present
        # FIRST, before the backup and the migrations: a run that migrates the
        # database and then cannot release leaves a new schema under old code.
        # Fails loudly, never a silent no-op (ADR-003).
        env:
          HAS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN != '' }}
          HAS_APP_ID: ${{ secrets.DIGITALOCEAN_APP_ID != '' }}
          HAS_PULL: ${{ secrets.GHCR_PULL_CREDENTIALS != '' }}
          FIRST_DEPLOY: ${{ inputs.first_deploy }}
        run: |
          rc=0
          [ "$HAS_TOKEN" = "true" ] || { echo "::error title=Deploy credentials::DIGITALOCEAN_ACCESS_TOKEN is not set in the production GitHub Environment"; rc=1; }
          [ "$HAS_PULL" = "true" ] || { echo "::error title=Deploy credentials::GHCR_PULL_CREDENTIALS (user:token with read:packages) is not set in the production GitHub Environment"; rc=1; }
          if [ "$FIRST_DEPLOY" = "true" ]; then
            [ "$HAS_APP_ID" = "false" ] || { echo "::error title=Deploy credentials::first_deploy=true but DIGITALOCEAN_APP_ID is already set; refusing to create a second app"; rc=1; }
          else
            [ "$HAS_APP_ID" = "true" ] || { echo "::error title=Deploy credentials::DIGITALOCEAN_APP_ID is not set in the production GitHub Environment (first time: run with first_deploy=true)"; rc=1; }
          fi
          [ "$rc" -eq 0 ] || echo "Nothing was changed. Owner steps: docs/infrastructure/production-readiness.md"
          exit "$rc"

      - name: Install doctl
        run: scripts/infra/install-doctl.sh

      - name: Validate the production configuration and resolve the app spec
        # Runs BEFORE anything is changed. The same values fill
        # .do/app.production.yaml; every manifest variable is listed, so
        # setting a variable or secret of that name in the `production` GitHub
        # Environment is all it takes to configure it (the `app-spec` guard
        # fails CI if one is missing here). The resolved spec holds secrets: it
        # is written mode 600 under RUNNER_TEMP and removed at the end.
        env:
          NODE_ENV: production
          APP_ENV: production
          # Proxies in front of the API on App Platform. Measure it on the live
          # app; a guessed count lets clients choose their own address
          # (apps/api/src/platform/auth/client-address.ts).
          TRUSTED_PROXY_HOPS: ${{ vars.TRUSTED_PROXY_HOPS }}
          PORT: '3000'
          LOG_LEVEL: info
          CORS_ALLOWED_ORIGINS: ${{ vars.PRODUCTION_CORS_ALLOWED_ORIGINS }}
          REQUEST_TIMEOUT_MS: ${{ vars.REQUEST_TIMEOUT_MS }}
          SHUTDOWN_GRACE_MS: '15000'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_STATEMENT_TIMEOUT_MS: '15000'
          DATABASE_POOL_MAX: '7'         # the API's pool; database-pool.ts has the 22-connection budget
          DATABASE_WORKER_POOL_MAX: '3'  # the worker's pool
          REDIS_URL: ${{ secrets.REDIS_URL }}
          QUEUE_PREFIX: jawwid-chat-production
          WORKER_CONCURRENCY: ${{ vars.WORKER_CONCURRENCY }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          RESET_CODE_HASH_SECRET: ${{ secrets.RESET_CODE_HASH_SECRET }}
          JWT_ACCESS_TTL: 15m
          JWT_REFRESH_TTL: 30d
          STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
          STORAGE_REGION: ${{ vars.STORAGE_REGION || 'auto' }}
          STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          STORAGE_SIGNED_URL_TTL_SECONDS: '300'
          STORAGE_CONNECT_TIMEOUT_MS: ${{ vars.STORAGE_CONNECT_TIMEOUT_MS }}
          STORAGE_REQUEST_TIMEOUT_MS: ${{ vars.STORAGE_REQUEST_TIMEOUT_MS }}
          STORAGE_MAX_ATTEMPTS: ${{ vars.STORAGE_MAX_ATTEMPTS }}
          STORAGE_SIGNING_SECRET: ${{ secrets.STORAGE_SIGNING_SECRET }}
          MEDIA_PUBLIC_BASE_URL: ${{ vars.MEDIA_PUBLIC_BASE_URL }}
          MATERIALS_SITE_BASE_URL: ${{ vars.MATERIALS_SITE_BASE_URL }}
          MATERIALS_FRAME_ORIGINS: ${{ vars.MATERIALS_FRAME_ORIGINS }}
          LESSON_APPROVALS_SIGNING_KEY: ${{ secrets.LESSON_APPROVALS_SIGNING_KEY }}
          STORAGE_LOCAL_ROOT: ${{ vars.STORAGE_LOCAL_ROOT }}
          STORAGE_PUBLIC_BASE_URL: ${{ vars.STORAGE_PUBLIC_BASE_URL }}
          OUTBOX_POLL_MS: ${{ vars.OUTBOX_POLL_MS }}
          OUTBOX_BATCH_SIZE: ${{ vars.OUTBOX_BATCH_SIZE }}
          OUTBOX_IDLE_BACKOFF_MS: ${{ vars.OUTBOX_IDLE_BACKOFF_MS }}
          ATTACHMENT_MAX_BYTES_IMAGE: ${{ vars.ATTACHMENT_MAX_BYTES_IMAGE }}
          ATTACHMENT_MAX_BYTES_VIDEO: ${{ vars.ATTACHMENT_MAX_BYTES_VIDEO }}
          ATTACHMENT_MAX_BYTES_VOICE: ${{ vars.ATTACHMENT_MAX_BYTES_VOICE }}
          ATTACHMENT_MAX_BYTES_FILE: ${{ vars.ATTACHMENT_MAX_BYTES_FILE }}
          ATTACHMENT_MAX_VOICE_DURATION_MS: ${{ vars.ATTACHMENT_MAX_VOICE_DURATION_MS }}
          FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
          APNS_BUNDLE_ID: ${{ vars.APNS_BUNDLE_ID }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          # Sandbox APNs silently drops production device tokens.
          APNS_PRODUCTION: 'true'
          # A URL, not a secret -- but the staging Environment was provisioned
          # (2026-09-24) with it as a secret, so either is accepted.
          LIVEKIT_URL: ${{ vars.LIVEKIT_URL || secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          CORE_BASE_URL: ${{ vars.CORE_BASE_URL }}
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          CORE_WEBHOOK_SECRET: ${{ secrets.CORE_WEBHOOK_SECRET }}
          CORE_TIMEOUT_MS: '5000'
          CORE_RETRY_MAX: '3'
          TEACHER_PAYOUT_KEYS: ${{ secrets.TEACHER_PAYOUT_KEYS }}
          # PD-25 parent self-recovery: each channel stays off until all of its variables are set.
          SMTP_URL: ${{ secrets.SMTP_URL }}
          RECOVERY_MAIL_FROM: ${{ vars.RECOVERY_MAIL_FROM }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_RECOVERY_TEMPLATE: ${{ vars.WHATSAPP_RECOVERY_TEMPLATE }}
          WHATSAPP_TEMPLATE_LANGUAGE: ${{ vars.WHATSAPP_TEMPLATE_LANGUAGE }}
          WHATSAPP_API_VERSION: ${{ vars.WHATSAPP_API_VERSION }}
          # PD-27: card payments (optional; unset = no card option, bank transfer
          # and cash still work) and the public origin payment links point at.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PAYMENT_LINK_BASE_URL: ${{ vars.PAYMENT_LINK_BASE_URL }}
          # PD-30: the payment lock is on in staging, off in production until the owner
          # sets the production variable to 'true'.
          SUBSCRIPTION_LOCK_ENFORCED: ${{ vars.SUBSCRIPTION_LOCK_ENFORCED || 'false' }}
          # PD-35: strict teacher-supervisor scope is off everywhere until the owner sets
          # the variable to 'true' (department head, 2026-10-26).
          TEACHER_SUPERVISOR_STRICT_SCOPE: ${{ vars.TEACHER_SUPERVISOR_STRICT_SCOPE || 'false' }}
          # PD-42: NOT defaulted -- unset keeps the value stored in chat.config ('all'
          # until written); the owner sets 'own' after the intake is verified.
          SALES_FAMILY_SCOPE: ${{ vars.SALES_FAMILY_SCOPE }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          OTEL_SERVICE_NAME: jawwid-chat-api
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_TRACES_SAMPLER_ARG: ${{ vars.OTEL_TRACES_SAMPLER_ARG }}
          HEALTH_PROBE_TIMEOUT_MS: ${{ vars.HEALTH_PROBE_TIMEOUT_MS }}
          GIT_COMMIT: ${{ inputs.image_tag }}
          BUILD_VERSION: production-${{ github.run_number }}
          BUILD_TIME: ${{ github.event.repository.updated_at }}
          PRISMA_MIGRATE_SKIP_GENERATE: ${{ vars.PRISMA_MIGRATE_SKIP_GENERATE }}
          # --- the app spec only (not the API process) ---
          API_IMAGE_TAG: ${{ inputs.image_tag }}
          ADMIN_WEB_IMAGE_TAG: ${{ needs.build-admin-web.outputs.admin_web_tag }}
          GHCR_PULL_CREDENTIALS: ${{ secrets.GHCR_PULL_CREDENTIALS }}
          # The hosts the app serves are derived from these two URLs.
          ADMIN_WEB_URL: ${{ vars.PRODUCTION_ADMIN_WEB_URL }}
          # Admin Web's CSP origins (apps/admin-web/infra-nginx/default.conf.template).
          API_ORIGIN: ${{ vars.PRODUCTION_API_BASE_URL }}
          REALTIME_ORIGIN: ${{ vars.PRODUCTION_REALTIME_URL }}
          LIVEKIT_ORIGIN: ${{ vars.LIVEKIT_URL || secrets.LIVEKIT_URL }}
          STORAGE_ORIGIN: ${{ vars.STORAGE_ENDPOINT }}
        run: |
          scripts/infra/check-env.sh production
          python3 scripts/infra/app-spec.py resolve production --out "$RUNNER_TEMP/app-spec.yaml"

      - name: Object storage keeps deleted objects for 30 days
        # BEFORE the backup and the migrations, so a refusal changes nothing.
        # Attachments, voice notes, avatars, Materials and whiteboard images
        # exist only in the bucket; without versioning a delete is final
        # (docs/infrastructure/backup-recovery.md, "Object storage"). Refuses
        # unless versioning is Enabled and the lifecycle expires noncurrent
        # versions after 30 days. The storage key needs read access to the
        # bucket's configuration (s3:GetBucketVersioning,
        # s3:GetLifecycleConfiguration); a refused call fails this step, it
        # never passes it. Fix with: scripts/infra/storage-versioning.sh apply
        env:
          STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
          STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
          STORAGE_REGION: ${{ vars.STORAGE_REGION }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
        run: scripts/infra/storage-versioning.sh verify

      - name: Preflight the database role capability
        # BEFORE the backup and BEFORE any migration. 20260910120200 grants
        # BYPASSRLS, which not every managed PostgreSQL permits; without this
        # the run fails at the seventeenth migration with the database half
        # applied. Changes nothing -- the probe is rolled back.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: scripts/db/preflight-role-capability.sh

      - name: Back up the database
        # Before migrations, every time, no exceptions. This is the artifact the
        # rollback procedure depends on; a migration that drops a column cannot
        # be undone by redeploying the previous image.
        #
        # ENCRYPTED, because the next step uploads it to GitHub as an artifact
        # and it is every family's messages. Without the secret, backup-db.sh
        # refuses before pg_dump runs, which stops the deployment before any
        # migration -- deliberately. The passphrase must ALSO be held outside
        # GitHub (secrets here are write-only): an archive nobody can decrypt is
        # not a backup. docs/infrastructure/backup-recovery.md §3.
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: scripts/infra/backup-db.sh --out ./backups --schema chat

      - name: Upload the pre-deployment backup
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-backup-${{ github.run_number }}
          path: backups/
          retention-days: 30

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          PSQL="psql -v ON_ERROR_STOP=1 $DATABASE_URL" scripts/db/apply.sh

      - name: Load the pinned Quran text
        # docs/product/quran-dataset-contract.md: after the migrations, from
        # this checkout (never inside the API image). The loader refuses a file
        # whose SHA-256 is not the pinned one, a count mismatch, a split or
        # empty ayah, and writes all or nothing; a dataset already loaded with
        # the same fingerprints is skipped. No dataset vendored: nothing to do.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          PSQL="psql -v ON_ERROR_STOP=1 $DATABASE_URL" scripts/db/load-quran.sh

      - name: Release
        # Deploys the resolved .do/app.production.yaml with doctl and fails
        # unless the ACTIVE deployment then runs exactly these image tags.
        # Refuses, loudly, without the token or the app id (ADR-003).
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DIGITALOCEAN_APP_ID: ${{ secrets.DIGITALOCEAN_APP_ID }}
          DIGITALOCEAN_PROJECT_ID: ${{ vars.DIGITALOCEAN_PROJECT_ID }}
          FIRST_DEPLOY: ${{ inputs.first_deploy }}
          API_IMAGE_TAG: ${{ inputs.image_tag }}
          ADMIN_WEB_IMAGE_TAG: ${{ needs.build-admin-web.outputs.admin_web_tag }}
        run: scripts/infra/do-release.sh production "$RUNNER_TEMP/app-spec.yaml"

      - name: Smoke test
        if: success()
        run: |
          scripts/infra/smoke.sh "${{ vars.PRODUCTION_API_BASE_URL }}" \
            --web "${{ vars.PRODUCTION_ADMIN_WEB_URL }}"

      - name: Record the release
        if: success()
        run: |
          {
            echo "### Production release"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| commit | \`${{ inputs.image_tag }}\` |"
            echo "| run | ${{ github.run_number }} |"
            echo "| deployed by | ${{ github.actor }} |"
            echo "| at | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the resolved app spec
        if: always()
        run: rm -f "$RUNNER_TEMP/app-spec.yaml"
