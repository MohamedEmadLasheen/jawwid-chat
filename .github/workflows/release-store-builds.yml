# Signed store builds with direct upload (LR-76 option (c), OT-2b).
#
# MANUAL ONLY. From the head of main (the commit it runs from), this workflow builds a signed Android App Bundle
# and/or a signed iOS app, verifies the signature, uploads the debug symbols to Sentry, and then
# uploads the build straight to the store's TESTING channel and nowhere else:
#   - Android: Google Play's INTERNAL testing track, as a DRAFT release (scripts/mobile/play-upload.sh;
#     the package, track and status are constants there). Signed in to Google through Workload
#     Identity Federation: no Google key is stored anywhere.
#   - iOS: App Store Connect / TestFlight. One cloud-signed export to a local .ipa, verified, its
#     SHA-256 recorded; Apple's altool then uploads that exact file (hash checked again first), in
#     an upload mode only (--upload-package, else --upload-app, else Transporter if present).
#     Nothing is sent for App Review and nothing is released.
# A person releases each build to testers, and later to the public, in Play Console and App Store
# Connect. No build output is kept as a GitHub artifact.
#
# Every job that sees a secret runs in the `store-release` GitHub Environment: the owner is the
# required reviewer, only `main` may deploy to it, and administrators may not bypass it. Preflight
# reads that configuration through the API and refuses the run unless all three hold;
# docs/release/signed-builds-ci.md lists it and everything else the owner must create. Secrets are
# referenced by name only and never printed.
#
# Environment secrets (store-release):
#   Android: ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_KEYSTORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS,
#            ANDROID_UPLOAD_KEY_PASSWORD, GOOGLE_SERVICES_JSON_BASE64, SENTRY_DSN, SENTRY_AUTH_TOKEN
#   iOS:     ASC_API_KEY_ID, ASC_API_ISSUER_ID, ASC_API_KEY_P8_BASE64, SENTRY_DSN, SENTRY_AUTH_TOKEN
# Environment variables (store-release), not secrets:
#   both:    API_BASE_URL, PRIVACY_POLICY_URL, TERMS_URL, SUPPORT_URL, SUPPORT_EMAIL (what
#            scripts/mobile/build-store.sh reads), SENTRY_ORG, SENTRY_PROJECT,
#            LESSONS_ORIGIN (optional), SENTRY_ENVIRONMENT (optional), SENTRY_URL (optional, https)
#   Android: PLAY_WIF_PROVIDER, PLAY_SERVICE_ACCOUNT,
#            ANDROID_UPLOAD_CERT_SHA256 (optional pin of the upload certificate's SHA-256)
#   iOS:     ASC_APP_APPLE_ID (the app's numeric Apple ID, for altool --upload-package when that
#            altool version requires it; always format-checked)
#
# Never add pull_request, pull_request_target, workflow_run or push triggers to this file.
# scripts/qa/check-store-upload-guards.sh (run by CI through scripts/qa/guards.sh) fails if this
# file gains another trigger, an unpinned action, an expression inside a run block, a GitHub
# artifact upload, a second job with id-token: write or a Google sign-in outside the android job,
# loses an identity assertion, uploads anything but the verified .ipa, runs xcrun or altool other
# than on its pinned lines (upload modes only), builds any commit but main's head at dispatch, lets
# sentry-cli see its token other than through env, print its output or read settings planted by an
# earlier step, or any other store channel or action; or if the release evidence check
# (scripts/mobile/verify-store-artifact.sh: target/min SDK, 16 KB alignment, AD_ID, Xcode/SDK stamp,
# privacy manifest, encryption flag, background modes) stops running on each signed artifact, failing
# the job, before anything leaves the runner (docs/release/signed-builds-ci.md §1a).
name: Release store builds

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Full 40-character commit SHA to build. Must be the head of main when the run is started.'
        required: true
        type: string
      platform:
        description: 'What to build'
        required: true
        type: choice
        options: [both, android, ios]
        default: both
      build_name:
        description: 'Version shown to users, x.y.z (BUILD_NAME)'
        required: true
        type: string
      build_number:
        description: 'Build number, a positive integer higher than the last upload to either store (BUILD_NUMBER)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-store-builds
  cancel-in-progress: false

jobs:
  preflight:
    # No environment and no secrets: refuses a bad request before anyone is asked to approve it.
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: read is only for reading the store-release Environment's protection rules (below).
    # A job-level block replaces the workflow's, so contents: read is repeated.
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: verify
        name: The workflow runs from main, and the commit is on main
        # Inputs reach the shell only through env, never through an expression inside the script.
        env:
          REF: ${{ inputs.ref }}
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Run this workflow from main (it ran from $GITHUB_REF)."; exit 1; }
          # This run's own identity, read from the runner and independent of any OIDC token. Google's
          # provider condition pins the same values (docs/release/signed-builds-ci.md §3.2); the
          # android job asserts them again before it signs in.
          [ "$GITHUB_REPOSITORY_ID" = 1362573850 ] || { echo "::error::repository id $GITHUB_REPOSITORY_ID is not 1362573850 (MohamedEmadLasheen/jawwid-chat)."; exit 1; }
          [ "$GITHUB_REPOSITORY_OWNER_ID" = 183662661 ] || { echo "::error::repository owner id $GITHUB_REPOSITORY_OWNER_ID is not 183662661 (MohamedEmadLasheen)."; exit 1; }
          [ "$GITHUB_REPOSITORY" = MohamedEmadLasheen/jawwid-chat ] || { echo "::error::repository $GITHUB_REPOSITORY is not MohamedEmadLasheen/jawwid-chat."; exit 1; }
          [ "$GITHUB_WORKFLOW_REF" = MohamedEmadLasheen/jawwid-chat/.github/workflows/release-store-builds.yml@refs/heads/main ] || { echo "::error::workflow ref $GITHUB_WORKFLOW_REF is not release-store-builds.yml on refs/heads/main."; exit 1; }
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::ref must be a full 40-character lower-case commit SHA."; exit 1; }
          [[ "$BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::build_name must be x.y.z (digits only)."; exit 1; }
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "::error::build_number must be a positive integer."; exit 1; }
          git cat-file -e "$REF^{commit}" 2>/dev/null || { echo "::error::$REF is not a commit in this repository."; exit 1; }
          git merge-base --is-ancestor "$REF" origin/main || { echo "::error::$REF is not on main. Store builds are made from reviewed, merged commits only."; exit 1; }
          # The build commit's own code (Gradle, Flutter, pub and CocoaPods steps) runs in the android
          # job, which can request the Google token (P2-1, docs/release/signed-builds-ci.md §6 risk 7).
          # So only the reviewed head of main, the very commit this workflow file runs from, is built.
          [ "$REF" = "$GITHUB_SHA" ] || { echo "::error::ref must be the head of main when the run was started (the workflow's own commit), not an older commit."; exit 1; }
          echo "sha=$REF" >> "$GITHUB_OUTPUT"
          {
            echo "### Store build request"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| commit | \`$REF\` |"
            echo "| version | $BUILD_NAME+$BUILD_NUMBER |"
            echo "| requested by | $GITHUB_ACTOR |"
            echo "| destination | Play internal testing (draft) / App Store Connect (TestFlight) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The store-release Environment is protected (reviewer, main only, no admin bypass)
        # GitHub creates an Environment named by a job on first use, with NO protection. Refuse the run
        # unless the owner's three settings are in place, so secrets are never pasted into an
        # unprotected Environment and approved by nobody. Fails closed: anything unreadable, missing
        # or unexpected is a refusal. Checked again by GitHub itself when the jobs below start.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() { gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$@"; }
          manual="Nothing was built. Configure the Environment as in docs/release/signed-builds-ci.md §3.1 (edit it if it already exists)."
          e="$(api "repos/$GITHUB_REPOSITORY/environments/store-release")" \
            || { echo "::error::Could not read the store-release Environment with the job token (it may not exist yet). $manual"; exit 1; }
          p="$(api "repos/$GITHUB_REPOSITORY/environments/store-release/deployment-branch-policies")" \
            || { echo "::error::Could not read store-release's deployment branch policies with the job token. $manual"; exit 1; }
          bad=0
          no() { echo "::error title=store-release is not protected::$1"; bad=1; }
          reviewers="$(jq -r '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]? | (.reviewer.login // .reviewer.slug // "?")] | join(", ")' <<<"$e")"
          [ -n "$reviewers" ] || no "it has no required reviewer"
          # jq's `//` treats false as missing, so every flag is compared as a string ("null" if absent).
          self_review="$(jq -r '[.protection_rules[]? | select(.type == "required_reviewers") | .prevent_self_review][0] | tostring' <<<"$e")"
          admins_bypass="$(jq -r '.can_admins_bypass | tostring' <<<"$e")"
          [ "$(jq -r '.deployment_branch_policy.custom_branch_policies | tostring' <<<"$e")" = true ] \
            && [ "$(jq -r '.deployment_branch_policy.protected_branches | tostring' <<<"$e")" = false ] \
            || no "its deployment branches are not 'Selected branches and tags'"
          [ "$(jq -c '[.branch_policies[]? | {name, type}]' <<<"$p")" = '[{"name":"main","type":"branch"}]' ] \
            || no "its only deployment branch rule must be the branch 'main'"
          [ "$admins_bypass" = false ] \
            || no "administrators may bypass it ($admins_bypass): untick 'Allow administrators to bypass configured protection rules'"
          {
            echo ""
            echo "### store-release Environment"
            echo ""
            echo "- required reviewers: ${reviewers:-none}"
            echo "- prevent self-review: $self_review"
            echo "- deployment branches: $(jq -r '[.branch_policies[]? | "\(.type) \(.name)"] | join(", ")' <<<"$p")"
            echo "- administrators may bypass: $admins_bypass"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$bad" -eq 0 ] || { echo "$manual"; exit 1; }

  android:
    name: Signed Android App Bundle, uploaded to Play internal testing as a draft
    needs: [preflight]
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: store-release
    # id-token: write lets google-github-actions/auth exchange this job's GitHub OIDC token for a
    # short-lived Google access token (Workload Identity Federation). Only this job has it, and only
    # this job signs in to Google. The Google provider accepts the token only when its claims are
    # repository_id 1362573850, repository_owner_id 183662661, ref refs/heads/main, environment
    # store-release and job_workflow_ref this file on main (docs/release/signed-builds-ci.md §3.2).
    # RESIDUAL RISK (P2-1): the build runs in this same job, because the verified .aab cannot be
    # handed to a separate upload job without a GitHub artifact or cache (both refused). Code from
    # the build commit (Gradle, Flutter, pub packages) could therefore request the Google token
    # itself. Preflight, and this job again, require that commit to be the head of main at
    # dispatch: only reviewed, merged code ever runs here (docs/release/signed-builds-ci.md §6).
    # A job-level block replaces the workflow's, so contents: read is repeated.
    permissions:
      contents: read
      id-token: write
    env:
      BUILD_NAME: ${{ inputs.build_name }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: This job's identity is the one Google's provider condition expects
        # From the runner's own context, before anything else and before the Google sign-in: a
        # mismatch fails here, closed, rather than at Google.
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY_ID" = 1362573850 ] || { echo "::error::repository id $GITHUB_REPOSITORY_ID is not 1362573850 (MohamedEmadLasheen/jawwid-chat)."; exit 1; }
          [ "$GITHUB_REPOSITORY_OWNER_ID" = 183662661 ] || { echo "::error::repository owner id $GITHUB_REPOSITORY_OWNER_ID is not 183662661 (MohamedEmadLasheen)."; exit 1; }
          [ "$GITHUB_REPOSITORY" = MohamedEmadLasheen/jawwid-chat ] || { echo "::error::repository $GITHUB_REPOSITORY is not MohamedEmadLasheen/jawwid-chat."; exit 1; }
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::ref $GITHUB_REF is not refs/heads/main."; exit 1; }
          [ "$GITHUB_WORKFLOW_REF" = MohamedEmadLasheen/jawwid-chat/.github/workflows/release-store-builds.yml@refs/heads/main ] || { echo "::error::workflow ref $GITHUB_WORKFLOW_REF is not release-store-builds.yml on refs/heads/main."; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - name: Check out the upload helpers from this workflow's own commit
        # Preflight requires the build commit to be this workflow's own commit, so these are the same
        # files; the helpers that talk to the stores are read from this second checkout so that they
        # always come from the workflow's commit.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: scripts/mobile
          persist-credentials: false
      - name: The checked-out build commit is this workflow's own commit (the head of main at dispatch)
        # Asserted again here, in the job that can request the Google token, before any of the
        # commit's code runs (P2-1).
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo "::error::the checked-out build commit is not this workflow's own commit; nothing was built."; exit 1; }
      - name: The Android secrets and variables are present and well-formed
        # Before any build. Booleans only for secrets: their values never enter this step.
        env:
          HAS_KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
          HAS_KS_PASS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS != '' }}
          HAS_KEY_PASS: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD != '' }}
          HAS_GSJ: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
          HAS_DSN: ${{ secrets.SENTRY_DSN != '' }}
          HAS_SENTRY_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
          WIF_PROVIDER: ${{ vars.PLAY_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          V_SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          V_SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          V_SENTRY_URL: ${{ vars.SENTRY_URL }}
          V_API_BASE_URL: ${{ vars.API_BASE_URL }}
          V_PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          V_TERMS_URL: ${{ vars.TERMS_URL }}
          V_SUPPORT_URL: ${{ vars.SUPPORT_URL }}
          V_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: |
          rc=0
          missing() { echo "::error title=Missing $1::$2 is not set in the store-release Environment${3:+ ($3)}"; rc=1; }
          for pair in HAS_KS:ANDROID_UPLOAD_KEYSTORE_BASE64 HAS_KS_PASS:ANDROID_UPLOAD_KEYSTORE_PASSWORD \
                      HAS_ALIAS:ANDROID_UPLOAD_KEY_ALIAS HAS_KEY_PASS:ANDROID_UPLOAD_KEY_PASSWORD \
                      HAS_GSJ:GOOGLE_SERVICES_JSON_BASE64 HAS_DSN:SENTRY_DSN HAS_SENTRY_TOKEN:SENTRY_AUTH_TOKEN; do
            flag="${pair%%:*}"
            [ "${!flag}" = true ] || missing secret "${pair#*:}"
          done
          for v in API_BASE_URL PRIVACY_POLICY_URL TERMS_URL SUPPORT_URL SUPPORT_EMAIL; do
            n="V_$v"; [ -n "${!n}" ] || missing variable "$v"
          done
          [[ "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]] \
            || missing variable PLAY_WIF_PROVIDER "projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>"
          [[ "$WIF_SERVICE_ACCOUNT" =~ ^[a-z0-9-]+@[a-z0-9-]+\.iam\.gserviceaccount\.com$ ]] \
            || missing variable PLAY_SERVICE_ACCOUNT "<name>@<project>.iam.gserviceaccount.com"
          [[ "$V_SENTRY_ORG" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || missing variable SENTRY_ORG "the organisation slug"
          [[ "$V_SENTRY_PROJECT" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || missing variable SENTRY_PROJECT "the project slug"
          [ -z "$V_SENTRY_URL" ] || [[ "$V_SENTRY_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$ ]] \
            || missing variable SENTRY_URL "optional; if set, https://<host>/"
          [ "$rc" -eq 0 ] || echo "Nothing was built. Owner steps: docs/release/signed-builds-ci.md"
          exit "$rc"
      - name: Use the runner's preinstalled JDK 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: false # a signing build never restores a cache another workflow wrote
      - name: Write the upload keystore, key.properties and google-services.json (mode 600)
        # The keystore lives under RUNNER_TEMP. android/key.properties and android/app/google-services.json
        # must sit where the Gradle build looks for them (android/app/build.gradle.kts); they are
        # git-ignored and removed by the clean-up step whatever happens.
        env:
          KS_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          GSJ_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          S="$RUNNER_TEMP/store-signing"; mkdir -p "$S"; chmod 700 "$S"
          KS="$S/upload-keystore"
          printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 --decode > "$KS" \
            || { echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 is not valid base64"; exit 1; }
          printf '%s' "$GSJ_B64" | tr -d '[:space:]' | base64 --decode > "$S/google-services.json" \
            || { echo "::error::GOOGLE_SERVICES_JSON_BASE64 is not valid base64"; exit 1; }
          chmod 600 "$KS" "$S/google-services.json"
          # These go into a Java properties file, which treats backslashes, line breaks and leading
          # spaces specially. Accept only characters it reads literally, as the docs ask, rather than
          # escape them.
          [[ "$KS_PASS" =~ ^[A-Za-z0-9]+$ ]] || { echo "::error::ANDROID_UPLOAD_KEYSTORE_PASSWORD must be letters and digits only"; exit 1; }
          [[ "$KEY_PASS" =~ ^[A-Za-z0-9]+$ ]] || { echo "::error::ANDROID_UPLOAD_KEY_PASSWORD must be letters and digits only"; exit 1; }
          [[ "$KEY_ALIAS" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::ANDROID_UPLOAD_KEY_ALIAS must be letters, digits, '.', '_' or '-' only"; exit 1; }
          # Wrong store password or alias fails here, with keytool's message and nothing secret.
          keytool -list -keystore "$KS" -storepass:env KS_PASS -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::The keystore does not open with ANDROID_UPLOAD_KEYSTORE_PASSWORD, or has no entry named by ANDROID_UPLOAD_KEY_ALIAS"; exit 1; }
          grep -q '"package_name": *"com.jawwid.jawwid_chat"' "$S/google-services.json" \
            || { echo "::error::GOOGLE_SERVICES_JSON_BASE64 does not decode to a google-services.json for com.jawwid.jawwid_chat"; exit 1; }
          install -m 600 "$S/google-services.json" android/app/google-services.json
          { printf 'storeFile=%s\n' "$KS"
            printf 'storePassword=%s\n' "$KS_PASS"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASS"; } > android/key.properties
          chmod 600 android/key.properties
          # The upload certificate's SHA-256 (public; Play Console shows the same value).
          sha="$(keytool -list -v -keystore "$KS" -storepass:env KS_PASS -alias "$KEY_ALIAS" | awk '/SHA256:/ && !f {print $2; f=1}')"
          [ -n "$sha" ] || { echo "::error::could not read the upload certificate's SHA-256"; exit 1; }
          echo "UPLOAD_CERT_SHA256=$sha" >> "$GITHUB_ENV"
      - name: Build the App Bundle through the store build script
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          TERMS_URL: ${{ vars.TERMS_URL }}
          SUPPORT_URL: ${{ vars.SUPPORT_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          LESSONS_ORIGIN: ${{ vars.LESSONS_ORIGIN }}
          SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT || 'production' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: bash scripts/mobile/build-store.sh android
      - name: Verify the App Bundle is signed with the upload key
        env:
          PINNED_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          [ -f "$AAB" ] || { echo "::error::no App Bundle at $AAB"; exit 1; }
          jarsigner -verify "$AAB" > "$RUNNER_TEMP/jarsigner.txt" 2>&1 || true
          grep -q '^jar verified\.' "$RUNNER_TEMP/jarsigner.txt" \
            || { cat "$RUNNER_TEMP/jarsigner.txt"; echo "::error::jarsigner does not verify the App Bundle"; exit 1; }
          signers="$(keytool -printcert -jarfile "$AAB" | awk '/SHA256:/{print $2}' | sort -u)"
          [ "$(printf '%s\n' "$signers" | grep -c .)" -eq 1 ] \
            || { echo "::error::expected exactly one signing certificate, found: $signers"; exit 1; }
          [ "$signers" = "$UPLOAD_CERT_SHA256" ] \
            || { echo "::error::the App Bundle is signed by $signers, not the upload key ($UPLOAD_CERT_SHA256)"; exit 1; }
          if [ -n "$PINNED_SHA256" ]; then
            norm() { printf '%s' "$1" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]'; }
            [ "$(norm "$signers")" = "$(norm "$PINNED_SHA256")" ] \
              || { echo "::error::the upload key in the secrets ($signers) is not the one pinned in ANDROID_UPLOAD_CERT_SHA256"; exit 1; }
          fi
          {
            echo "### Android App Bundle $BUILD_NAME+$BUILD_NUMBER"
            echo ""
            echo "- jarsigner: jar verified"
            echo "- upload certificate SHA-256: \`$signers\`${PINNED_SHA256:+ (matches the pinned value)}"
            echo "- App Bundle SHA-256: \`$(sha256sum "$AAB" | awk '{print $1}')\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Release evidence from the signed App Bundle (LR-50, LR-51, Data safety; a failure stops the run before Sentry and Play)
        # Read-only: scripts/mobile/verify-store-artifact.sh reads the signed .aab's own manifest with
        # bundletool (pinned version and SHA-256, scripts/mobile/install-bundletool.sh) and every native
        # library with readelf: targetSdk 36, minSdk 26, 16 KB alignment of the 64-bit libraries, no
        # AD_ID. It writes only the checked values to the summary; any failed check fails the job here.
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          BT="$(bash release-tools/scripts/mobile/install-bundletool.sh "$RUNNER_TEMP/bundletool")"
          rc=0
          out="$(bash release-tools/scripts/mobile/verify-store-artifact.sh android "$AAB" "$BT" "$BUILD_NAME" "$BUILD_NUMBER")" || rc=$?
          printf '%s\n' "$out"
          { echo ""; printf '%s\n' "$out"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" -eq 0 ] || { echo "::error::the signed App Bundle failed its release evidence checks; nothing was uploaded."; exit 1; }
      - name: Install sentry-cli (pinned version and SHA-256)
        run: |
          set -euo pipefail
          p="$(bash release-tools/scripts/mobile/install-sentry-cli.sh "$RUNNER_TEMP/sentry-cli")"
          "$p" --version
          echo "SENTRY_CLI=$p" >> "$GITHUB_ENV"
      - name: Upload the debug symbols to Sentry (before the store upload, so a failure stops the release)
        # docs/mobile/store-builds.md "Debug symbols": the Dart split-debug-info symbols, and the R8
        # mapping file when the build wrote one. Symbols go to Sentry and nowhere else, and nothing of
        # them, of the token or of sentry-cli's configuration reaches the log:
        #   - sentry-cli reads the token, organisation, project and (optional) server from this env
        #     only, never from a command line; it logs at warn;
        #   - nothing an earlier step planted is read (P2-2): every SENTRY_* / SENTRYCLI_* variable
        #     but the five set here, proxy, CA-bundle and dynamic-loader variables are unset (an
        #     earlier step could have added them through GITHUB_ENV); .env loading is off; it runs in
        #     a freshly created, empty directory that is also its HOME (removed and re-made, never
        #     reused); and the step refuses to run if a .sentryclirc exists in any parent directory;
        #   - its output goes to a file that is never printed: one summary line per upload, and on a
        #     failure only sentry-cli's own "error:" lines, cut short;
        #   - that directory and build/symbols are deleted by the always-cleanup step.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_LOG_LEVEL: warn
          SENTRY_NO_PROGRESS_BAR: '1'
        run: |
          set -euo pipefail
          for v in $(compgen -e); do case "$v" in SENTRY_CLI | SENTRY_AUTH_TOKEN | SENTRY_ORG | SENTRY_PROJECT | SENTRY_URL | SENTRY_LOG_LEVEL | SENTRY_NO_PROGRESS_BAR) : ;; SENTRY* | *_proxy | *_PROXY | SSL_CERT_* | CURL_CA_BUNDLE | LD_* | DYLD_*) unset "$v" ;; esac; done
          export SENTRY_LOAD_DOTENV=0
          [ -n "$SENTRY_URL" ] || unset SENTRY_URL
          O="$RUNNER_TEMP/sentry-out"; rm -rf "$O"; mkdir -m 700 "$O"; cd "$O"
          d="$O"; while [ "$d" != / ]; do d="$(dirname "$d")"; [ ! -e "$d/.sentryclirc" ] || { echo "::error::a planted Sentry settings file exists in $d; nothing was sent to Sentry."; exit 1; }; done
          sq() { # what, then the arguments
            local what="$1"; shift
            if HOME="$O" "$SENTRY_CLI" "$@" > "$O/sentry.log" 2>&1; then
              echo "Sentry: $what uploaded"
            else
              grep -E '^[[:space:]]*error:' "$O/sentry.log" | cut -c1-200 | head -5 || true
              echo "::error title=Sentry upload failed::$what was not uploaded (check SENTRY_ORG, SENTRY_PROJECT, SENTRY_URL and the token, docs/release/signed-builds-ci.md §3.5). Nothing was sent to Play."
              exit 1
            fi
          }
          SYM="$GITHUB_WORKSPACE/build/symbols/android/$BUILD_NAME+$BUILD_NUMBER"
          [ -n "$(ls -A "$SYM" 2>/dev/null)" ] || { echo "::error::no Dart symbols in build/symbols/android (split-debug-info path not honoured)"; exit 1; }
          sq "Dart symbols" debug-files upload "$SYM"
          MAP="$GITHUB_WORKSPACE/build/app/outputs/mapping/release/mapping.txt"
          if [ -f "$MAP" ]; then
            sq "R8 mapping" upload-proguard "$MAP"
            echo "- Sentry: Dart symbols and the R8 mapping file uploaded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Sentry: Dart symbols uploaded (the build wrote no R8 mapping file)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - id: gauth
        name: Sign in to Google with Workload Identity Federation (no stored key)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          access_token_lifetime: 1800s
          create_credentials_file: false
      - name: Upload the App Bundle to Play internal testing as a draft release
        # scripts/mobile/play-upload.sh: package, track (internal) and status (draft) are constants
        # there. The token reaches it through env only; it never prints it.
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.gauth.outputs.access_token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PLAY_ACCESS_TOKEN"
          bash release-tools/scripts/mobile/play-upload.sh \
            build/app/outputs/bundle/release/app-release.aab "$BUILD_NAME" "$BUILD_NUMBER"
          echo "- Google Play: draft release '$BUILD_NAME ($BUILD_NUMBER)' on the internal testing track; release it to testers in Play Console" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the signing material, the symbols and the build outputs
        if: always()
        run: |
          rm -f android/key.properties android/app/google-services.json
          rm -rf "$RUNNER_TEMP/store-signing" "$RUNNER_TEMP/jarsigner.txt" "$RUNNER_TEMP/sentry-cli"
          rm -rf "$RUNNER_TEMP/sentry-out" build/symbols build/app/outputs

  ios:
    name: Signed iOS app, uploaded to App Store Connect / TestFlight (cloud signing; UNVERIFIED until the first run)
    needs: [preflight]
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-26
    timeout-minutes: 90
    environment: store-release
    env:
      BUILD_NAME: ${{ inputs.build_name }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      TEAM_ID: KX683HAR3Y
      BUNDLE_ID: com.jawwid.jawwidChat
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - name: Check out the upload helpers from this workflow's own commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: scripts/mobile
          persist-credentials: false
      - name: The iOS secrets and variables are present and well-formed
        # Before any build. Booleans only for secrets: their values never enter this step.
        env:
          HAS_KEY_ID: ${{ secrets.ASC_API_KEY_ID != '' }}
          HAS_ISSUER: ${{ secrets.ASC_API_ISSUER_ID != '' }}
          HAS_P8: ${{ secrets.ASC_API_KEY_P8_BASE64 != '' }}
          HAS_DSN: ${{ secrets.SENTRY_DSN != '' }}
          HAS_SENTRY_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
          V_SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          V_SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          V_SENTRY_URL: ${{ vars.SENTRY_URL }}
          V_API_BASE_URL: ${{ vars.API_BASE_URL }}
          V_PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          V_TERMS_URL: ${{ vars.TERMS_URL }}
          V_SUPPORT_URL: ${{ vars.SUPPORT_URL }}
          V_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          V_ASC_APP_APPLE_ID: ${{ vars.ASC_APP_APPLE_ID }}
        run: |
          rc=0
          missing() { echo "::error title=Missing $1::$2 is not set in the store-release Environment${3:+ ($3)}"; rc=1; }
          [[ "$V_ASC_APP_APPLE_ID" =~ ^[1-9][0-9]{5,14}$ ]] \
            || missing variable ASC_APP_APPLE_ID "the app's numeric Apple ID, App Store Connect > the app > App Information"
          for pair in HAS_KEY_ID:ASC_API_KEY_ID HAS_ISSUER:ASC_API_ISSUER_ID HAS_P8:ASC_API_KEY_P8_BASE64 \
                      HAS_DSN:SENTRY_DSN HAS_SENTRY_TOKEN:SENTRY_AUTH_TOKEN; do
            flag="${pair%%:*}"
            [ "${!flag}" = true ] || missing secret "${pair#*:}"
          done
          for v in API_BASE_URL PRIVACY_POLICY_URL TERMS_URL SUPPORT_URL SUPPORT_EMAIL; do
            n="V_$v"; [ -n "${!n}" ] || missing variable "$v"
          done
          [[ "$V_SENTRY_ORG" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || missing variable SENTRY_ORG "the organisation slug"
          [[ "$V_SENTRY_PROJECT" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || missing variable SENTRY_PROJECT "the project slug"
          [ -z "$V_SENTRY_URL" ] || [[ "$V_SENTRY_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$ ]] \
            || missing variable SENTRY_URL "optional; if set, https://<host>/"
          [ "$rc" -eq 0 ] || echo "Nothing was built. Owner steps: docs/release/signed-builds-ci.md"
          exit "$rc"
      - name: Select Xcode 26 explicitly
        run: |
          x="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)"
          [ -n "$x" ] || { echo "::error::no Xcode 26 on this runner image"; ls -d /Applications/Xcode*; exit 1; }
          sudo xcode-select -s "$x/Contents/Developer"
          xcodebuild -version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: false # a signing build never restores a cache another workflow wrote
      - name: This commit's build script can configure an iOS build for CI
        run: |
          grep -q 'ios-config' scripts/mobile/build-store.sh \
            || { echo "::error::scripts/mobile/build-store.sh at this commit has no ios-config target; build a newer commit"; exit 1; }
      - name: Write the App Store Connect API key (mode 600, under RUNNER_TEMP)
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          P8_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$ASC_API_KEY_ID" =~ ^[A-Za-z0-9]+$ ]] || { echo "::error::ASC_API_KEY_ID must be letters and digits only"; exit 1; }
          [[ "$ASC_API_ISSUER_ID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]] \
            || { echo "::error::ASC_API_ISSUER_ID must be a UUID (App Store Connect > Users and Access > Integrations)"; exit 1; }
          S="$RUNNER_TEMP/store-signing"; mkdir -p "$S"; chmod 700 "$S"
          P8="$S/AuthKey_$ASC_API_KEY_ID.p8"
          printf '%s' "$P8_B64" | tr -d '[:space:]' | base64 --decode > "$P8" \
            || { echo "::error::ASC_API_KEY_P8_BASE64 is not valid base64"; exit 1; }
          chmod 600 "$P8"
          # Parse it rather than look for text: proves it is a private key, and prints nothing.
          openssl pkey -in "$P8" -noout > /dev/null 2>&1 \
            || { echo "::error::ASC_API_KEY_P8_BASE64 does not decode to an App Store Connect .p8 private key"; exit 1; }
          echo "ASC_KEY_PATH=$P8" >> "$GITHUB_ENV"
      - name: Configure the Flutter build through the store build script (no signing yet)
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          TERMS_URL: ${{ vars.TERMS_URL }}
          SUPPORT_URL: ${{ vars.SUPPORT_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          LESSONS_ORIGIN: ${{ vars.LESSONS_ORIGIN }}
          SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT || 'production' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: bash scripts/mobile/build-store.sh ios-config
      - name: Archive, and export a local .ipa with cloud signing (UNVERIFIED flags; fails clearly)
        # WWDC21 "Distribute apps in Xcode with cloud signing": xcodebuild (Xcode 13+) signs in with an
        # App Store Connect key through -authenticationKeyPath/-authenticationKeyID/-authenticationKeyIssuerID
        # and "still requires allow provisioning updates". UNVERIFIED on Xcode 26: that the archive's
        # development signing and the export's cloud distribution signing both work with an App Manager
        # key (Admin may be needed), and that no extra flag is required. The full xcodebuild log stays on
        # the runner: it lists build settings, including the base64 dart-defines that carry SENTRY_DSN.
        # Only error lines are printed, and never one that mentions DART_DEFINES.
        # This is the ONLY export (destination export, to a local .ipa on the runner). The next step
        # verifies it and records its SHA-256; the upload step sends that same file, byte for byte.
        # Symbols are not put inside the .ipa for Apple: they go to Sentry only.
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/ios-build"; mkdir -p "$B"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH"
                -authenticationKeyID "$ASC_API_KEY_ID" -authenticationKeyIssuerID "$ASC_API_ISSUER_ID")
          run_quiet() { # label log command...
            local label="$1" log="$2"; shift 2
            if ! "$@" > "$log" 2>&1; then
              grep -E 'error:|error -|\*\* .* FAILED \*\*|No profiles|No Accounts|not authorized|requires a provisioning profile' "$log" \
                | grep -v 'DART_DEFINES' | head -60 || true
              echo "::error title=$label failed::see the lines above and docs/release/signed-builds-ci.md, 'If the iOS job fails'"
              exit 1
            fi
          }
          run_quiet "xcodebuild archive" "$B/archive.log" \
            xcodebuild -quiet -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
              -destination 'generic/platform=iOS' -archivePath "$B/Runner.xcarchive" "${AUTH[@]}" archive
          cat > "$B/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><false/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$B/ExportOptions.plist"
          run_quiet "xcodebuild export (local .ipa)" "$B/export.log" \
            xcodebuild -quiet -exportArchive -archivePath "$B/Runner.xcarchive" \
              -exportOptionsPlist "$B/ExportOptions.plist" -exportPath "$B/export" "${AUTH[@]}"
      - name: Verify the .ipa is App Store signed, for this app and version
        run: |
          set -uo pipefail
          B="$RUNNER_TEMP/ios-build"; bad=0
          rec() { echo "$1 $2"; echo "- $1 $2" >> "$B/report.md"; [ "$1" = FAIL ] && bad=1; return 0; }
          echo "### iOS .ipa $BUILD_NAME+$BUILD_NUMBER" > "$B/report.md"
          ipas=("$B"/export/*.ipa)
          [ "${#ipas[@]}" -eq 1 ] && [ -f "${ipas[0]}" ] || { echo "::error::expected exactly one .ipa in $B/export"; ls -la "$B/export" || true; exit 1; }
          rm -rf "$B/check"; mkdir -p "$B/check"; ditto -x -k "${ipas[0]}" "$B/check"
          APP="$(ls -d "$B"/check/Payload/*.app | head -1)"
          [ -d "$APP" ] || { echo "::error::no .app inside the .ipa"; exit 1; }
          get() { plutil -extract "$2" raw -o - "$1" 2>/dev/null || true; }
          if codesign --verify --deep --strict "$APP" 2>/dev/null; then rec PASS "codesign --verify --deep --strict"; else rec FAIL "codesign --verify --deep --strict"; fi
          info="$(codesign -dvv "$APP" 2>&1 || true)"
          case "$(printf '%s\n' "$info" | grep -m1 '^Authority=')" in
            "Authority=Apple Distribution"* | "Authority=iPhone Distribution"*) rec PASS "signed with a distribution certificate" ;;
            *) rec FAIL "not signed with a distribution certificate (first authority is not Apple/iPhone Distribution)" ;;
          esac
          printf '%s\n' "$info" | grep -qx "TeamIdentifier=$TEAM_ID" && rec PASS "team $TEAM_ID" || rec FAIL "team is not $TEAM_ID"
          codesign -d --entitlements - --xml "$APP" > "$B/entitlements.plist" 2>/dev/null || true
          [ "$(get "$B/entitlements.plist" get-task-allow)" = false ] && rec PASS "get-task-allow false" || rec FAIL "get-task-allow is not false (not a distribution signature)"
          [ "$(get "$B/entitlements.plist" aps-environment)" = production ] && rec PASS "aps-environment production" || rec FAIL "aps-environment is not production"
          security cms -D -i "$APP/embedded.mobileprovision" > "$B/profile.plist" 2>/dev/null || true
          if [ ! -s "$B/profile.plist" ]; then rec FAIL "no readable embedded.mobileprovision"
          # xml1, not raw: raw refuses an array, which would hide a device list.
          elif plutil -extract ProvisionedDevices xml1 -o - "$B/profile.plist" > /dev/null 2>&1 \
            || plutil -extract ProvisionsAllDevices xml1 -o - "$B/profile.plist" > /dev/null 2>&1; then
            rec FAIL "the profile lists devices or all devices: not an App Store profile"
          else rec PASS "App Store provisioning profile (no device list)"; fi
          P="$APP/Info.plist"
          [ "$(get "$P" CFBundleIdentifier)" = "$BUNDLE_ID" ] && rec PASS "bundle id $BUNDLE_ID" || rec FAIL "bundle id is not $BUNDLE_ID"
          [ "$(get "$P" CFBundleShortVersionString)" = "$BUILD_NAME" ] && rec PASS "version $BUILD_NAME" || rec FAIL "CFBundleShortVersionString is not $BUILD_NAME"
          [ "$(get "$P" CFBundleVersion)" = "$BUILD_NUMBER" ] && rec PASS "build $BUILD_NUMBER" || rec FAIL "CFBundleVersion is not $BUILD_NUMBER"
          SYM="build/symbols/ios/$BUILD_NAME+$BUILD_NUMBER"
          [ -n "$(ls -A "$SYM" 2>/dev/null)" ] && rec PASS "Dart symbols in $SYM" || rec FAIL "no Dart symbols in $SYM (split-debug-info path not honoured)"
          [ -n "$(ls -A "$B/Runner.xcarchive/dSYMs" 2>/dev/null)" ] && rec PASS "dSYMs in the archive" || rec FAIL "no dSYMs in the archive"
          # The CodeDirectory hash of every signed bundle in the .ipa (the app, its frameworks and
          # extensions), for the record. The upload sends this very file (its SHA-256 is checked again
          # just before), so these are the cdhashes App Store Connect receives.
          : > "$B/cdhashes.txt"
          for x in "$APP" "$APP"/Frameworks/* "$APP"/PlugIns/*; do
            [ -e "$x" ] || continue
            d="$(codesign -d -vvv "$x" 2>&1 || true)"
            h="$(printf '%s\n' "$d" | awk -F= '/^CandidateCDHashFull sha256=/{print $2; exit}')"
            [ -n "$h" ] || h="$(printf '%s\n' "$d" | awk -F= '/^CDHash=/{print $2; exit}')"
            if [ -n "$h" ]; then echo "${x#"$B/check/Payload/"} $h" >> "$B/cdhashes.txt"; else rec FAIL "no cdhash for ${x#"$B/check/Payload/"}"; fi
          done
          rec PASS "cdhashes recorded for $(grep -c . "$B/cdhashes.txt") signed bundle(s)"
          IPA="${ipas[0]}"
          chmod a-w "$IPA"
          sha="$(shasum -a 256 "$IPA" | awk '{print $1}')"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] && rec PASS ".ipa SHA-256 $sha" || rec FAIL "could not hash the .ipa"
          { cat "$B/report.md"; echo ""; echo "cdhashes:"; echo '```'; cat "$B/cdhashes.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$bad" -eq 0 ] || { echo "::error::the .ipa failed verification; it is not uploaded"; exit 1; }
          echo "VERIFIED_IPA=$IPA" >> "$GITHUB_ENV"
          echo "VERIFIED_IPA_SHA256=$sha" >> "$GITHUB_ENV"
          # Read from the verified .ipa's own Info.plist (and checked above against the inputs), for
          # the uploader's bundle flags.
          echo "VERIFIED_BUNDLE_ID=$(get "$P" CFBundleIdentifier)" >> "$GITHUB_ENV"
          echo "VERIFIED_VERSION=$(get "$P" CFBundleShortVersionString)" >> "$GITHUB_ENV"
          echo "VERIFIED_BUILD=$(get "$P" CFBundleVersion)" >> "$GITHUB_ENV"
      - name: Release evidence from the signed .ipa (LR-52, LR-58, LR-73; a failure stops the run before Sentry and App Store Connect)
        # Read-only: the verified .ipa (its SHA-256 checked again) is unpacked into a fresh directory, and
        # scripts/mobile/verify-store-artifact.sh reads the app's Info.plist and PrivacyInfo.xcprivacy
        # with plutil: DTXcode / DTSDKName (Xcode 26, iOS 26 SDK), ITSAppUsesNonExemptEncryption false,
        # UIBackgroundModes exactly audio and voip, the privacy manifest present with its required-reason
        # APIs and the collected data types of ios/Runner/PrivacyInfo.xcprivacy. It writes only the
        # checked values to the summary; any failed check fails the job here.
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/ios-build"
          [ -n "${VERIFIED_IPA:-}" ] && [ -f "$VERIFIED_IPA" ] || { echo "::error::no verified .ipa; nothing was uploaded."; exit 1; }
          [ "$(shasum -a 256 "$VERIFIED_IPA" | awk '{print $1}')" = "$VERIFIED_IPA_SHA256" ] || { echo "::error::the .ipa is not the one verified (SHA-256 differs); nothing was uploaded."; exit 1; }
          E="$B/evidence"; rm -rf "$E"; mkdir -p "$E"; ditto -x -k "$VERIFIED_IPA" "$E"
          apps=("$E"/Payload/*.app)
          [ "${#apps[@]}" -eq 1 ] && [ -d "${apps[0]}" ] || { echo "::error::expected exactly one .app inside the verified .ipa; nothing was uploaded."; exit 1; }
          rc=0
          out="$(bash release-tools/scripts/mobile/verify-store-artifact.sh ios "${apps[0]}" ios/Runner/PrivacyInfo.xcprivacy)" || rc=$?
          printf '%s\n' "$out"
          { echo ""; printf '%s\n' "$out"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" -eq 0 ] || { echo "::error::the signed .ipa failed its release evidence checks; nothing was uploaded."; exit 1; }
      - name: Install sentry-cli (pinned version and SHA-256)
        run: |
          set -euo pipefail
          p="$(bash release-tools/scripts/mobile/install-sentry-cli.sh "$RUNNER_TEMP/sentry-cli")"
          "$p" --version
          echo "SENTRY_CLI=$p" >> "$GITHUB_ENV"
      - name: Upload the debug symbols to Sentry (before the store upload, so a failure stops the release)
        # docs/mobile/store-builds.md "Debug symbols": the archive's dSYMs and the Dart
        # split-debug-info symbols, handled exactly as in the android job (token through env only,
        # log level warn, planted SENTRY_* / proxy / loader variables unset, no .env, a freshly made
        # empty working directory and HOME, no .sentryclirc in any parent, output kept off the log,
        # symbols and output deleted by the always-cleanup step). Symbols go to Sentry only.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_LOG_LEVEL: warn
          SENTRY_NO_PROGRESS_BAR: '1'
        run: |
          set -euo pipefail
          for v in $(compgen -e); do case "$v" in SENTRY_CLI | SENTRY_AUTH_TOKEN | SENTRY_ORG | SENTRY_PROJECT | SENTRY_URL | SENTRY_LOG_LEVEL | SENTRY_NO_PROGRESS_BAR) : ;; SENTRY* | *_proxy | *_PROXY | SSL_CERT_* | CURL_CA_BUNDLE | LD_* | DYLD_*) unset "$v" ;; esac; done
          export SENTRY_LOAD_DOTENV=0
          [ -n "$SENTRY_URL" ] || unset SENTRY_URL
          O="$RUNNER_TEMP/sentry-out"; rm -rf "$O"; mkdir -m 700 "$O"; cd "$O"
          d="$O"; while [ "$d" != / ]; do d="$(dirname "$d")"; [ ! -e "$d/.sentryclirc" ] || { echo "::error::a planted Sentry settings file exists in $d; nothing was sent to Sentry."; exit 1; }; done
          sq() { # what, then the arguments
            local what="$1"; shift
            if HOME="$O" "$SENTRY_CLI" "$@" > "$O/sentry.log" 2>&1; then
              echo "Sentry: $what uploaded"
            else
              grep -E '^[[:space:]]*error:' "$O/sentry.log" | cut -c1-200 | head -5 || true
              echo "::error title=Sentry upload failed::$what was not uploaded (check SENTRY_ORG, SENTRY_PROJECT, SENTRY_URL and the token, docs/release/signed-builds-ci.md §3.5). Nothing was sent to App Store Connect."
              exit 1
            fi
          }
          sq "dSYMs" debug-files upload "$RUNNER_TEMP/ios-build/Runner.xcarchive/dSYMs"
          sq "Dart symbols" debug-files upload "$GITHUB_WORKSPACE/build/symbols/ios/$BUILD_NAME+$BUILD_NUMBER"
          echo "- Sentry: dSYMs and Dart symbols uploaded" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the verified .ipa itself to App Store Connect with altool (no review, no release; UNVERIFIED flags)
        # The bytes uploaded are the bytes verified. There is one export; the verification step
        # recorded the .ipa's SHA-256 and made it read-only, and that hash is checked again on the line
        # right before the one upload command that runs. Apple's altool (shipped with Xcode) uploads
        # that file with the App Store Connect API key, in an upload mode only. Which uploader runs is
        # decided from altool's help text, never by trying one upload and then another:
        #   1. altool --upload-package "$VERIFIED_IPA" --type ios --apiKey --apiIssuer, if altool's
        #      help lists it; and only if that help also names --apple-id, with the app's numeric
        #      Apple ID (the ASC_APP_APPLE_ID variable) and --bundle-id / --bundle-version /
        #      --bundle-short-version-string read from the verified .ipa's own Info.plist;
        #   2. else altool --upload-app -f "$VERIFIED_IPA" -t ios (the older upload mode);
        #   3. else Apple's Transporter command-line tool, only if the runner has it (Xcode 14+ does
        #      not ship it, and Transporter.app is only in the Mac App Store);
        #   4. else the job fails and uploads nothing.
        # No second export (Apple would sign it again, and that signature could not be compared with
        # the verified one before it is sent), no other uploader and no other altool mode (the guard
        # pins every altool line). Success is the uploader's exit status 0 AND its own success line
        # ("No errors uploading" or "UPLOAD SUCCEEDED" for altool); anything else fails closed and prints only the
        # uploader's error lines. Nothing here asks for App Review or releases a version.
        # UNVERIFIED until the first run: every altool flag exactly as written below (whether
        # --upload-package on Xcode 26 needs --apple-id and the --bundle-* flags, and whether its help
        # naming --apple-id is the right signal for passing them),
        # that altool finds the key in ~/.appstoreconnect/private_keys, and the "No errors uploading"/"UPLOAD SUCCEEDED"
        # wording. The full uploader log stays on the runner.
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_APP_APPLE_ID: ${{ vars.ASC_APP_APPLE_ID }}
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/ios-build"
          [ -n "${VERIFIED_IPA:-}" ] && [ -f "$VERIFIED_IPA" ] || { echo "::error::no verified .ipa; nothing was uploaded."; exit 1; }
          [ ! -w "$VERIFIED_IPA" ] || { echo "::error::the verified .ipa is writable again; nothing was uploaded."; exit 1; }
          [[ "$ASC_APP_APPLE_ID" =~ ^[1-9][0-9]{5,14}$ ]] || { echo "::error::ASC_APP_APPLE_ID is not the app's numeric Apple ID; nothing was uploaded."; exit 1; }
          [ "${VERIFIED_BUNDLE_ID:-}" = "$BUNDLE_ID" ] && [ "${VERIFIED_VERSION:-}" = "$BUILD_NAME" ] && [ "${VERIFIED_BUILD:-}" = "$BUILD_NUMBER" ] \
            || { echo "::error::the verification step did not record this app's bundle id, version and build; nothing was uploaded."; exit 1; }
          # The key file, named AuthKey_<id>.p8, only for this step: removed when it ends, and again by
          # the always-cleanup step.
          K="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$K"; chmod 700 "$K"
          KF="$K/$(basename "$ASC_KEY_PATH")"
          trap 'rm -f "$KF"' EXIT
          install -m 600 "$ASC_KEY_PATH" "$KF"
          # Which upload mode this altool has, from its help text only (nothing is uploaded to find out).
          AH="$(xcrun altool --help 2>&1 || true)"
          rc=0
          if grep -qF -e '--upload-package' <<<"$AH"; then
            OK='No errors uploading|UPLOAD SUCCEEDED'
            # The app's Apple ID and the bundle flags only if this altool's help names them (older
            # altool versions require them with --upload-package); otherwise the plain form.
            if grep -qF -e '--apple-id' <<<"$AH"; then
              HOW='upload-package, with the Apple ID and bundle flags'
              [ "$(shasum -a 256 "$VERIFIED_IPA" | awk '{print $1}')" = "$VERIFIED_IPA_SHA256" ] || { echo "::error::the .ipa is not the one verified (SHA-256 differs); nothing was uploaded."; exit 1; }
              xcrun altool --upload-package "$VERIFIED_IPA" --type ios --apple-id "$ASC_APP_APPLE_ID" --bundle-id "$VERIFIED_BUNDLE_ID" --bundle-version "$VERIFIED_BUILD" --bundle-short-version-string "$VERIFIED_VERSION" --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID" > "$B/upload.log" 2>&1 || rc=$?
            else
              HOW='upload-package'
              [ "$(shasum -a 256 "$VERIFIED_IPA" | awk '{print $1}')" = "$VERIFIED_IPA_SHA256" ] || { echo "::error::the .ipa is not the one verified (SHA-256 differs); nothing was uploaded."; exit 1; }
              xcrun altool --upload-package "$VERIFIED_IPA" --type ios --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID" > "$B/upload.log" 2>&1 || rc=$?
            fi
          elif grep -qF -e '--upload-app' <<<"$AH"; then
            HOW='upload-app'
            OK='No errors uploading|UPLOAD SUCCEEDED'
            [ "$(shasum -a 256 "$VERIFIED_IPA" | awk '{print $1}')" = "$VERIFIED_IPA_SHA256" ] || { echo "::error::the .ipa is not the one verified (SHA-256 differs); nothing was uploaded."; exit 1; }
            xcrun altool --upload-app -f "$VERIFIED_IPA" -t ios --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID" > "$B/upload.log" 2>&1 || rc=$?
          else
            T="$(xcrun --find iTMSTransporter 2>/dev/null || true)"
            TA=/Applications/Transporter.app/Contents/itms/bin/iTMSTransporter
            [ -n "$T" ] || [ ! -x "$TA" ] || T="$TA"
            [ -n "$T" ] || { echo "::error title=No uploader on this runner::Apple's uploader lists no upload mode here and Transporter was not found. Nothing was uploaded. The verified .ipa is uploaded byte for byte or not at all (no second export, no other uploader); tell the lead."; exit 1; }
            HOW='Transporter'
            OK='uploaded successfully'
            [ "$(shasum -a 256 "$VERIFIED_IPA" | awk '{print $1}')" = "$VERIFIED_IPA_SHA256" ] || { echo "::error::the .ipa is not the one verified (SHA-256 differs); nothing was uploaded."; exit 1; }
            "$T" -m upload -assetFile "$VERIFIED_IPA" -apiKey "$ASC_API_KEY_ID" -apiIssuer "$ASC_API_ISSUER_ID" -v informational > "$B/upload.log" 2>&1 || rc=$?
          fi
          # Only the uploader's own error lines, cut short; never a line naming the key's folder.
          show() { grep -E '\*\*\* Error|ERROR ITMS-|\[ERROR\]|[Ee]rror:|were not uploaded|could not be uploaded|not authorized|already been uploaded|bundle version' "$B/upload.log" | grep -v 'private_keys' | cut -c1-300 | head -40 || true; }
          # Exit status 0 is not enough: the uploader must also print its success line, and no error.
          if [ "$rc" -ne 0 ] || ! grep -qE "$OK" "$B/upload.log" \
             || grep -qE '\*\*\* Error|ERROR ITMS-|were not uploaded|could not be uploaded' "$B/upload.log"; then
            show
            echo "::error title=App Store Connect upload not confirmed::$HOW exited $rc or did not report success. Look in App Store Connect before any re-run: if the build is there, a re-run needs a new build_number. See docs/release/signed-builds-ci.md, 'If the iOS job fails'."
            exit 1
          fi
          echo "- App Store Connect: the verified .ipa (SHA-256 \`$VERIFIED_IPA_SHA256\`), build $BUILD_NAME ($BUILD_NUMBER), uploaded ($HOW); it appears in TestFlight after Apple processes it" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the signing material, the symbols, build logs and outputs
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/store-signing" "$RUNNER_TEMP/ios-build" "$RUNNER_TEMP/sentry-cli"
          rm -rf "$RUNNER_TEMP/sentry-out" build/symbols
          [ -z "${ASC_KEY_PATH:-}" ] || rm -f "$HOME/.appstoreconnect/private_keys/$(basename "$ASC_KEY_PATH")"
