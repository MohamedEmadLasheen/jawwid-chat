<!doctype html>
<!--
  Arabic and RTL are the default document state, not something JavaScript
  applies after the first paint: the operators work in Arabic, and a first
  frame laid out left-to-right is a visible flash on every load. The
  I18nProvider still owns the live value and overwrites both attributes when
  the operator switches to English.
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>جَوِّد — لوحة التواصل</title>

    <!--
      IBM Plex Sans Arabic (`design-system.md` §3.1). Preconnect so the face is
      in flight before the CSS asks for it, and `display=swap` so the fallback
      stack in tokens.css renders Arabic correctly from the first frame — the
      font is an improvement on the text, never a precondition for it.

      Production follow-up: self-host these two files with the app so a staff
      console on a restricted network does not depend on a third-party origin.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
