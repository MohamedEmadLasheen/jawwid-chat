# Jawwid Chat — local development stack.
#
# Owner: AI #7 (infrastructure). Replaces the ad-hoc `docker run` containers
# that were started by hand during bring-up. Same ports, same credentials, so
# existing apps/*/.env files keep working — but now reproducible.
#
#   scripts/infra/dev.sh up       start everything and wait for health
#   scripts/infra/dev.sh down     stop (data preserved)
#   scripts/infra/dev.sh nuke     stop and delete volumes
#
# Every port is overridable so this stack can run alongside another checkout:
#   POSTGRES_PORT=15433 REDIS_PORT=16380 docker compose up -d
#
# NOTE ON THE POSTGRES IMAGE
# Plain Postgres 17, matching the `postgres:17` service CI runs against.
#
# This changed on 2026-09-05 when the product owner locked the database
# decision: Jawwid Chat is standalone and owns its own PostgreSQL database, and
# Jawwid Core integration goes through an API/webhook boundary rather than
# direct database coupling (docs/product-operations/database-divergence.md).
# The Supabase image was only ever justified by Chat living inside Core's
# database; that premise is gone, so the smaller, faster image is correct and
# local now matches CI. See decisions.md ADR-001.

name: jawwid-chat

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: jawwid-chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-jawwid_chat}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -U postgres, not the app role: this asks "is the server accepting
      # connections", which is what dependent services actually need.
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-jawwid_chat}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: jawwid-chat-redis
    restart: unless-stopped
    # appendonly keeps BullMQ jobs across a restart. A queue that loses its
    # backlog on `docker restart` teaches developers the wrong failure model.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. Production uses Cloudflare R2 (ADR-005);
  # MinIO speaks the same API so upload/signed-URL code paths are identical.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: jawwid-chat-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-jawwid-dev}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-jawwid-dev-secret}
    ports:
      - "${STORAGE_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the attachment bucket and keeps it PRIVATE. Runs once and exits.
  # Attachments are customer communication content; a public bucket here would
  # train the codebase to assume public reads.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:-jawwid-chat-attachments}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-jawwid-dev}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-jawwid-dev-secret}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$STORAGE_ACCESS_KEY $$STORAGE_SECRET_KEY &&
      mc mb --ignore-existing local/$$STORAGE_BUCKET &&
      mc anonymous set none local/$$STORAGE_BUCKET &&
      echo 'bucket ready (private)'
      "
    restart: "no"

  # ------------------------------------------------------------------------
  # Calling. The API has minted correctly signed LiveKit tokens since Phase 5;
  # until now nothing in this repository ran a server for them to be presented
  # to, so a developer's call connected to nothing and failed as a timeout
  # rather than as a missing service.
  # ------------------------------------------------------------------------
  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.8}
    container_name: jawwid-chat-livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      # The TCP media fallback. Without it a client on a UDP-blocking network
      # cannot establish media at all.
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      # The UDP media range, narrowed in livekit.yaml so it can be published
      # explicitly — Docker Desktop cannot map the default ephemeral range.
      - "50000-50019:50000-50019/udp"
    healthcheck:
      # LiveKit's own readiness endpoint. `wget` is present in the image.
      test: ["CMD", "wget", "-qO-", "http://localhost:7880/"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The component that ACTUALLY RECORDS. It joins a room as a hidden
  # participant, mixes the audio and writes the file to S3-compatible storage
  # itself — the file never passes through the API, exactly as an attachment
  # upload never does.
  #
  # Optional locally: it is a heavy container (it ships a headless Chrome), and
  # a developer working on messaging has no reason to run it. Started with
  # `docker compose --profile recording up`. Nothing else in the stack depends
  # on it, and the API degrades honestly without it — a recording request fails
  # and the recording row is marked `failed` rather than sitting pending
  # forever.
  egress:
    image: ${LIVEKIT_EGRESS_IMAGE:-livekit/egress:v1.9}
    container_name: jawwid-chat-egress
    restart: unless-stopped
    profiles: ["recording"]
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./infra/livekit/egress.yaml:/etc/egress.yaml:ro
    # Egress needs to reach the LiveKit server it records from, and Redis is
    # the channel the two use to exchange jobs.
    depends_on:
      livekit:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
