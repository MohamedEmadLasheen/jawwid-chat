include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Localisation is not optional in this product: a hardcoded user-visible string is a
    # defect, not a style nit (§46).
    missing_required_param: error
    missing_return: error
  exclude:
    - "**/*.g.dart"
    - "lib/l10n/app_localizations*.dart"
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    always_declare_return_types: true
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    unawaited_futures: true
    use_super_parameters: true
    directives_ordering: true
    require_trailing_commas: true
    # Dart forbids `this._field` as a *named* parameter, so this rule cannot be satisfied
    # by the constructors here, which deliberately keep their fields private while taking
    # public named arguments.
    prefer_initializing_formals: false
