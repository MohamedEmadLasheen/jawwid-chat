name: jawwid_chat
description: Jawwid Chat — the parent and teacher mobile application for the Jawwid Quran and Arabic academy.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management. One solution only (§68).
  flutter_riverpod: ^3.4.3

  # Navigation and deep links (§52).
  go_router: ^18.0.1

  # Networking (§48).
  dio: ^5.11.1
  web_socket_channel: ^3.0.3

  # Voice calling media. The backend has minted correctly signed LiveKit tokens
  # since Phase 5; this is the client that actually presents one and carries
  # audio. LiveKit is the SFU chosen in the PRD (§11), and its official Flutter
  # SDK is the reason that choice was made over building raw WebRTC.
  #
  # Media transport ONLY. Every authorization decision stays on the server:
  # this package is handed a room and a short-lived token it cannot mint, and
  # it never learns who may call whom.
  livekit_client: ^2.12.0

  # Realtime. The backend's gateway is Socket.IO (@nestjs/platform-socket.io),
  # and Engine.IO's handshake, upgrade and framing are a protocol on top of a
  # websocket rather than a convention over one -- so web_socket_channel alone
  # cannot talk to it without reimplementing that protocol.
  socket_io_client: ^3.1.6

  # Storage. Tokens go to the platform keystore/keychain, never to preferences (§50, §56).
  flutter_secure_storage: ^11.0.0
  sqflite: ^2.4.3
  shared_preferences: ^2.5.5
  path: ^1.9.1

  # Localisation and formatting (§45, §46).
  intl: ^0.20.3

  # Utilities.
  uuid: ^4.6.0
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  # Push. firebase_messaging is the only supported way to receive an FCM
  # message on Android and to bridge APNs on iOS -- unlike the SERVER side,
  # where sending is one signed JWT and one POST and firebase-admin would have
  # been an enormous tree for it, there is no hand-rollable equivalent for the
  # receiving end. It sits behind the PushMessaging interface so the app's own
  # logic is testable without a Firebase project, and so a build with no
  # `google-services.json` degrades to no push rather than refusing to start.
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

  # Attachment selection. ONE picker, covering images, video, audio and
  # documents: image_picker plus a separate document picker would be two
  # overlapping frameworks and two permission stories for one affordance.
  file_picker: ^12.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

  # The offline queue's whole point is that it survives a restart, and that
  # cannot be asserted against a fake: it needs a real SQLite engine. This is
  # the same engine sqflite uses on device, running on the test VM.
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  generate: true

  # Brand assets. Explicit file paths rather than a directory, so adding a file
  # to `assets/brand/` is a deliberate act and the bundle never grows by
  # accident. These are the owner-approved production derivatives of the
  # official source artwork (which stays out of the app bundle — it is an opaque
  # JPEG and unusable on a dark canvas).
  assets:
    - assets/brand/jawwid-lockup-derived.png
    # Dark-theme variant of the same lockup: identical geometry and alpha, with
    # the teal lifted to #2A94AD (5.01:1 on the dark canvas, against 2.19:1) and
    # the white edge matte removed. Light and dark are a PAIR — neither replaces
    # the other, because each ink only clears contrast on its own background.
    - assets/brand/jawwid-lockup-dark-derived.png
    - assets/brand/jawwid-mark-derived.png
