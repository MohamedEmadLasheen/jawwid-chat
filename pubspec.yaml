name: jawwid_chat
description: Jawwid Chat — the parent and teacher mobile application for the Jawwid Quran and Arabic academy.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management. One solution only (§68).
  flutter_riverpod: ^3.4.3

  # Navigation and deep links (§52).
  go_router: ^18.0.1

  # Networking (§48).
  dio: ^5.11.1
  web_socket_channel: ^3.0.3
  # Voice call media. The server owns the room, the grant and the token (W1/W3);
  # this is only the client that joins with what it is given. Pinned to a
  # version whose own constraints this SDK satisfies -- 2.13.0 requires Dart
  # >=3.10.0 and Flutter >=3.38.0, against our ^3.13.0 / >=3.47.0.
  #
  # AUDIO ONLY. The SDK exposes camera and screen share; W1 restricted the
  # server-issued grant to canPublishSources: ['microphone'], so publishing
  # either would be refused by LiveKit. The client does not offer them either --
  # see lib/core/call_media, and the tests that assert no camera or screen API
  # is reached for.
  #
  # Reached only through the seam in lib/core/call_media/call_media_client.dart,
  # so no test needs a microphone or a room.
  livekit_client: ^2.13.0

  # Realtime signalling. The backend speaks SOCKET.IO, not bare WebSocket:
  # API-CONTRACT §1 fixes the handshake as socket.io `auth: { token }` on the
  # default namespace, and the gateway is a Nest @WebSocketGateway. web_socket_channel
  # above cannot perform that handshake or framing, so it is not an alternative.
  # The sibling client (apps/admin-web) already uses socket.io-client ^4.8.1, so
  # this is the same protocol version on both clients rather than a second one.
  # Reached only through the seam in lib/core/realtime/realtime_socket.dart, so
  # no test opens a socket.
  socket_io_client: ^3.1.6

  # Storage. Tokens go to the platform keystore/keychain, never to preferences (§50, §56).
  flutter_secure_storage: ^11.0.0
  sqflite: ^2.4.3
  shared_preferences: ^2.5.5
  path: ^1.9.1

  # Localisation and formatting (§45, §46).
  intl: ^0.20.3

  # Utilities.
  uuid: ^4.6.0
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1

  # Voice notes. Recording and playback are the client's own (mobile-contract
  # "Voice notes: you own recording, playback and speed"); both are reached only
  # through the seams in lib/core/audio so tests never touch a platform channel.
  record: ^7.1.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6

  # Photos and files. Both are reached only through the seam in
  # lib/core/media/media_picker.dart, so no test ever opens a platform picker.
  # file_selector rather than file_picker: every package here is flutter.dev's
  # own, which is the same bar the rest of this dependency list is held to.
  image_picker: ^1.2.3
  file_selector: ^1.1.0
  # PD-28: the picked file as both pickers already return it. On a phone it is a
  # path; in a browser it is a blob: URL that `dart:io` cannot open. Reading the
  # bytes through XFile works on both. flutter.dev's own, already in the tree
  # through both pickers.
  cross_file: ^0.3.5
  url_launcher: ^6.3.2

  # PD-29 Materials: an HTML5 activity (the academy's existing packages and
  # links) plays in a WebView. flutter.dev's own, the same bar as every other
  # dependency here. Reached only through the seam in
  # lib/features/materials/presentation/activity_view.dart -- no JavaScript
  # channel, navigation pinned to the activity -- so no test opens a platform
  # view. The web build (PD-28) never compiles it: it opens a new tab instead.
  webview_flutter: ^4.13.0

  # Story video. The ONLY reason this is here: the Stories backend accepts
  # video/mp4, quicktime and webm, so a video story must actually play -- and
  # nothing else in this app plays video (a video ATTACHMENT is deliberately a
  # file, opened by the platform). flutter.dev's own package, which is the same
  # bar every other dependency here is held to, and it is reached only through
  # the seam in lib/core/media/story_video_player.dart so no test touches a
  # platform channel.
  video_player: ^2.14.0
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2

  # PD-23 app lock: Face ID / Touch ID / Android BiometricPrompt, with the device
  # passcode as the fallback. flutter.dev's own package. The app never sees
  # biometric data -- the platform answers yes or no. Reached only through the
  # seam in lib/features/app_lock/data/app_lock_authenticator.dart, so no test
  # touches the platform channel. Android needs MainActivity to be a
  # FlutterFragmentActivity; iOS needs NSFaceIDUsageDescription.
  local_auth: ^3.0.2

  # PD-28: the teacher web portal. Browser storage (sessionStorage /
  # localStorage), the Web Locks API and the user agent, for the token store and
  # the device name -- the same three things Admin Web uses. dart.dev's own, and
  # already in the tree through the web plugins. Imported only behind a
  # conditional import (lib/core/storage/browser_storage_web.dart), so the phone
  # builds never compile it.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  # Brand assets. Explicit file paths rather than a directory, so adding a file
  # to `assets/brand/` is a deliberate act and the bundle never grows by
  # accident. These are the owner-approved production derivatives of the
  # official source artwork (which stays out of the app bundle — it is an opaque
  # JPEG and unusable on a dark canvas).
  assets:
    - assets/brand/jawwid-lockup-derived.png
    # Dark-theme variant of the same lockup: identical geometry and alpha, with
    # the teal lifted to #2A94AD (5.01:1 on the dark canvas, against 2.19:1) and
    # the white edge matte removed. Light and dark are a PAIR — neither replaces
    # the other, because each ink only clears contrast on its own background.
    - assets/brand/jawwid-lockup-dark-derived.png
    - assets/brand/jawwid-mark-derived.png

    # Shipped so the font licence travels with the binary that uses it, and so
    # `LicenseRegistry` (see `lib/main.dart`) can surface it in the app's own
    # licence page. OFL 1.1 §2 requires the licence to accompany the fonts.
    - assets/fonts/OFL.txt
    # PD-39: Amiri Quran's licence (SIL OFL 1.1), for the same reason.
    - assets/fonts/OFL-Amiri.txt

  # IBM Plex Sans Arabic — SIL Open Font License 1.1, © 2017 IBM Corp., Reserved
  # Font Name "Plex". Byte-identical to the Google Fonts upstream of record
  # (github.com/google/fonts, ofl/ibmplexsansarabic), whose own upstream is
  # github.com/googlefonts/plex.
  #
  # §3.1 names this family as the base, and `typography.dart` has declared it
  # since the design system landed — but the files were never bundled, so every
  # string in the app was silently rendering in the platform fallback instead.
  #
  # Exactly the four weights §3.2 uses, and no others: 400 body, 500 caption,
  # 600 headings/labels/buttons, 700 display/h1. The family ships no italic, so
  # the `FontStyle.italic` call sites get a synthesised slant — unchanged from
  # before, where the fallback font did the same thing.
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # PD-39: Quran verses on the whiteboard, as the shared Quran dataset's
    # contract names (docs/product/quran-dataset-contract.md "Fonts"). Amiri
    # 1.003 (SIL OFL 1.1), from the upstream release Amiri-1.003.zip (sha256
    # 81af0aff7d2086d8af24cea7202f7546130997982534691373485cd96744d05e);
    # AmiriQuran.ttf sha256 e2a47644762d16bdfb6d33e0d8db8c6ff30beae84150ef5a705316bbd829455c.
    - family: Amiri Quran
      fonts:
        - asset: assets/fonts/AmiriQuran.ttf
