name: jawwid_chat
description: Jawwid Chat — the parent and teacher mobile application for the Jawwid Quran and Arabic academy.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management. One solution only (§68).
  flutter_riverpod: ^3.4.3

  # Navigation and deep links (§52).
  go_router: ^18.0.1

  # Networking (§48).
  dio: ^5.11.1
  web_socket_channel: ^3.0.3

  # Realtime. The backend's gateway is Socket.IO (@nestjs/platform-socket.io),
  # and Engine.IO's handshake, upgrade and framing are a protocol on top of a
  # websocket rather than a convention over one -- so web_socket_channel alone
  # cannot talk to it without reimplementing that protocol.
  socket_io_client: ^3.1.6

  # Storage. Tokens go to the platform keystore/keychain, never to preferences (§50, §56).
  flutter_secure_storage: ^11.0.0
  sqflite: ^2.4.3
  shared_preferences: ^2.5.5
  path: ^1.9.1

  # Localisation and formatting (§45, §46).
  intl: ^0.20.3

  # Utilities.
  uuid: ^4.6.0
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

  # The offline queue's whole point is that it survives a restart, and that
  # cannot be asserted against a fake: it needs a real SQLite engine. This is
  # the same engine sqflite uses on device, running on the test VM.
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  generate: true
