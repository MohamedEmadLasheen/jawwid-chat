name: jawwid_chat
description: Jawwid Chat — the parent and teacher mobile application for the Jawwid Quran and Arabic academy.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management. One solution only (§68).
  flutter_riverpod: ^3.4.3

  # Navigation and deep links (§52).
  go_router: ^18.0.1

  # Networking (§48).
  dio: ^5.11.1
  web_socket_channel: ^3.0.3

  # Storage. Tokens go to the platform keystore/keychain, never to preferences (§50, §56).
  flutter_secure_storage: ^11.0.0
  sqflite: ^2.4.3
  shared_preferences: ^2.5.5
  path: ^1.9.1

  # Localisation and formatting (§45, §46).
  intl: ^0.20.3

  # Utilities.
  uuid: ^4.6.0
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1

  # Voice notes. Recording and playback are the client's own (mobile-contract
  # "Voice notes: you own recording, playback and speed"); both are reached only
  # through the seams in lib/core/audio so tests never touch a platform channel.
  record: ^7.1.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  # Realtime. The backend is Socket.IO (apps/api .../realtime.gateway.ts), and
  # Socket.IO is a protocol on top of WebSocket, not a WebSocket: speaking it
  # with the web_socket_channel already in this list would mean reimplementing
  # Engine.IO framing, reconnection and acknowledgements by hand. One transport,
  # matching the server (§48).
  socket_io_client: ^3.1.6

  # Push. FCM is the one transport that serves both platforms this app targets
  # (android/ and ios/ exist; there is no web target), because iOS goes through
  # FCM's own APNs bridge. Reached only through the seams in lib/core/push, so
  # no test ever touches a platform channel — the same rule the audio seams
  # follow.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
