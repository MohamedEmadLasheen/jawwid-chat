# codex-delegate: repositories no delegated agent may work in without the owner's explicit,
# recorded authorization (`--owner-approval "<the owner's words>"` and `--risk high`).
#
# One extended regular expression per line, matched against the repository's `origin` URL and
# against its absolute path. Lines starting with # are comments. Add, never silently remove.
#
# Jawwid Core: GitHub MohamedEmadLasheen/jawwid (note: NOT jawwid-chat), and its local clone.
github\.com[:/]MohamedEmadLasheen/jawwid(\.git)?/?$
^/Users/[^/]+/Documents/jawwid-core(/|$)
