# codex-delegate: repositories no delegated agent may work in, or review, without the owner's
# explicit, recorded authorization (`--owner-approval "<the owner's words>"` and `--risk high`).
#
# One rule per line. Lines starting with # are comments. Add, never silently remove.
# - An extended regular expression, matched case-insensitively against EVERY remote URL of the
#   repository and against its absolute path (and its main checkout's path).
# - `root:<sha>`: matches any clone whose history contains that root commit, wherever it lives.
# The engine also has these Jawwid Core rules built in, so protection holds without this file.
#
# Jawwid Core (GitHub MohamedEmadLasheen/jawwid, NOT jawwid-chat): any host, ssh alias or port.
(^|[:/])MohamedEmadLasheen/jawwid(\.git)?/?$
^/Users/[^/]+/Documents/jawwid-core(/|$)
